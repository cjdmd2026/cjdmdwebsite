<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>COCO:LANG 산책 성향 연구소</title>

  <!-- Pretendard -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
  >

  <!-- 공통 CSS -->
  <link
    rel="stylesheet"
    href="test.css?v=6"
  >
</head>


<body class="start-page">

  <main class="test-app">

    <section class="start-screen">

      <!-- 배경.webp -->
      <img
        src="img/test-start-bg.webp"
        class="start-bg"
        alt=""
        aria-hidden="true"
      >


      <!-- 콘텐츠 -->
      <div class="start-content">


        <!-- 타이틀 -->
        <img
          src="img/title.webp"
          class="start-title"
          alt="산책성향 연구소"
        >


        <!-- 설명 -->
        <p class="start-description">
          우리 강아지의 산책 스타일을 알아보고<br>
          성향이 맞는 친구를 찾아보세요!
        </p>


        <!-- 시작 버튼 -->
        <button
          type="button"
          id="startButton"
          class="start-button"
          aria-label="테스트 시작하기"
        >

          <img
            src="img/start-button.webp"
            alt="테스트 시작하기"
          >

        </button>

      </div>

    </section>

  </main>



  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const startButton =
          document.getElementById("startButton");


        startButton.addEventListener(
          "click",
          function () {

            window.location.href =
              "pet-status.html";

          }
        );

      }
    );

  </script>

  <script src="audio.js"></script>


</body>
</html>
