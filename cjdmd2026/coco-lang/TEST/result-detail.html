        /* =====================================
           궁합 카드 설정
        ====================================== */

        function setMatchItem(
          button,
          image,
          nameElement,
          typeName
        ) {


          image.src =
            getTypeImagePath(
              typeName
            );


          image.alt =
            selectedBreedName +
            " " +
            typeName;


          nameElement.textContent =
            typeName;


          button.dataset.type =
            typeName;


          button.onclick =
            function () {


              /*
               * 중요:
               * 실제 resultType은 수정하지 않음
               */

              localStorage.setItem(
                "detailViewType",
                typeName
              );


              window.location.href =
                "result-detail.html";

            };

        }

            typeImageIdMap[

            !typeId
          ) {

          detailMainImage.src =
            getTypeImagePath(
              detailViewType
            );


          detailMainImage.alt =
            selectedBreedName +
            " " +
            detailViewType +
            " 상세 이미지";


          /* 제목 */

          detailTypeName.textContent =
            detailViewType;


          detailTypeName.classList.toggle(
            "detail-long-name",
            detailViewType ===
              "엄마바라기형"
          );


          /* 설명 */

          detailDescription.innerHTML =
            data.descriptions
              .map(
                function (
                  text
                ) {

                  return (
                    "<p>" +
                    "<span class='detail-description-dot'>•</span>" +
                    text +
                    "</p>"
                  );

                }
              )
              .join("");


          /* 코드 */

          detailCode.textContent =
            typeCodeMap[
              detailViewType
            ];


          /* 태그 */

          detailTag01.textContent =
            data.tags[0];


          detailTag02.textContent =
            data.tags[1];


          detailTag03.textContent =
            data.tags[2];


          /* 잘맞는 유형 */

          setMatchItem(
            goodMatch01,
            goodMatchImage01,
            goodMatchName01,
            data.good[0]
          );


          setMatchItem(
            goodMatch02,
            goodMatchImage02,
            goodMatchName02,
            data.good[1]
          );


          /* 안맞는 유형 */

          setMatchItem(
            badMatch01,
            badMatchImage01,
            badMatchName01,
            data.bad[0]
          );


          setMatchItem(
            badMatch02,
            badMatchImage02,
            badMatchName02,
            data.bad[1]
          );

        }


        /* =====================================
           내 결과로 돌아가기
        ====================================== */

        backResultButton.addEventListener(
          "click",
          function () {


            /*
             * 상세페이지에서 보고 있던
             * 임시 유형만 삭제
             */

            localStorage.removeItem(
              "detailViewType"
            );


            /*
             * 혹시 이전 코드에서 resultType을
             * 덮어쓴 기록이 남아있을 수 있으므로
             * 원래 결과를 한 번 더 복구
             */

            localStorage.setItem(
              "resultType",
              originalResultType
            );


            localStorage.setItem(
              "personalityType",
              originalResultType
            );


            if (originalResultCode) {


              localStorage.setItem(
                "resultCode",
                originalResultCode
              );


              localStorage.setItem(
                "personalityCode",
                originalResultCode
              );

            }


            window.location.href =
              "result.html";

          }
        );


        /* =====================================
           다른 유형 보기
        ====================================== */

        otherTypeButton.addEventListener(
          "click",
          function () {


            localStorage.removeItem(
              "detailViewType"
            );


            window.location.href =
              "types.html";

          }
        );


        /* =====================================
           출력
        ====================================== */

        renderDetail();

      }
    );

  </script>

<script src="audio.js"></script>

</body>
