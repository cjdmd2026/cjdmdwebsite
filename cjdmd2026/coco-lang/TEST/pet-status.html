<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>COCO:LANG - 반려견 여부 선택</title>

  <!-- Pretendard -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
  >

  <!-- 공통 CSS -->
  <link
    rel="stylesheet"
    href="test.css?v=10"
  >
</head>


<body class="pet-status-page">

  <main class="pet-status-stage">

    <!-- =========================
         배경.webp
    ========================== -->
    <img
      src="img/pet-status-bg.webp"
      class="pet-status-bg-image"
      alt=""
      aria-hidden="true"
    >


    <!-- =========================
         가운데 콘텐츠
    ========================== -->
    <section class="pet-status-content">


      <!-- 제목 -->
      <header class="pet-status-heading">

        <h1>
          현재 반려견과 함께하고 있나요?
        </h1>

        <p>
          우리 강아지의 성향을 알아보거나,
          마음에 드는 강아지를 선택해 테스트해볼 수 있어요.
        </p>

      </header>



      <!-- =========================
           선택 카드
      ========================== -->
      <div class="pet-status-options">


        <!-- 반려견 있음 -->
        <button
          type="button"
          class="pet-status-card pet-status-card--yes"
          data-value="yes"
          aria-pressed="false"
        >


          <span class="pet-status-card-small">
            반려견을
          </span>


          <strong class="pet-status-card-title">
            키우고 있어요
          </strong>


          <span class="pet-status-card-desc">
            우리 강아지의 성향을<br>
            확인해볼 수 있어요
          </span>

        </button>



        <!-- 반려견 없음 -->
        <button
          type="button"
          class="pet-status-card pet-status-card--no"
          data-value="no"
          aria-pressed="false"
        >


          <span class="pet-status-card-small">
            반려견을
          </span>


          <strong class="pet-status-card-title">
            키우고 있지 않아요
          </strong>


          <span class="pet-status-card-desc">
            마음에 드는 강아지를 선택하고<br>
            테스트를 체험할 수 있어요
          </span>

        </button>


      </div>



      <!-- =========================
           선택 버튼
      ========================== -->
      <button
        type="button"
        id="petStatusNext"
        class="pet-status-next"
        disabled
      >

        <span>
          선택하기
        </span>

      </button>


    </section>

  </main>



  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const cards =
          document.querySelectorAll(
            ".pet-status-card"
          );

        const nextButton =
          document.getElementById(
            "petStatusNext"
          );

        let selectedStatus = null;



        /* =========================
           카드 선택
        ========================= */

        cards.forEach(function (card) {

          card.addEventListener(
            "click",
            function () {

              cards.forEach(function (item) {

                item.classList.remove(
                  "is-selected"
                );

                item.setAttribute(
                  "aria-pressed",
                  "false"
                );

              });


              card.classList.add(
                "is-selected"
              );


              card.setAttribute(
                "aria-pressed",
                "true"
              );


              selectedStatus =
                card.dataset.value;


              nextButton.disabled = false;

              nextButton.classList.add(
                "is-active"
              );

            }
          );

        });



        /* =========================
           다음 페이지 이동
        ========================= */

        nextButton.addEventListener(
          "click",
          function () {

            if (!selectedStatus) {
              return;
            }


            sessionStorage.setItem(
              "petStatus",
              selectedStatus
            );


            /* 반려견 있음 */

            if (selectedStatus === "yes") {

              sessionStorage.setItem(
                "isVirtualDog",
                "false"
              );

              window.location.href =
                "dog-info.html";

            }


            /* 반려견 없음 */

            if (selectedStatus === "no") {

              sessionStorage.setItem(
                "isVirtualDog",
                "true"
              );

              window.location.href =
                "guest-info.html";

            }

          }
        );

      }
    );

  </script>

<script src="audio.js"></script>

</body>

</html>
