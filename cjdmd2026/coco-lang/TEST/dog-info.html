<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>COCO:LANG - 우리 강아지 정보</title>

  <!-- Pretendard -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
  >

  <!-- 공통 CSS -->
  <link
    rel="stylesheet"
    href="test.css?v=8"
  >
</head>


<body class="profile-page">

  <main class="profile-stage">


    <!-- 전체 배경.webp -->
    <img
      src="img/dog-info-bg.webp"
      class="profile-background"
      alt=""
      aria-hidden="true"
    >


    <section class="profile-content">


      <!-- 제목 -->
      <header class="profile-heading">

        <h1>
          우리 강아지를 소개해주세요!
        </h1>

        <p>
          반려견의 기본 정보를 입력해주세요.
        </p>

      </header>



      <!-- 메인 영역 -->
      <div class="profile-main">


        <!-- 왼쪽 이미지 -->
        <div class="profile-image-area">


          <!-- 프레임.webp -->
          <img
            src="img/dog-frame.webp"
            class="profile-frame"
            alt=""
            aria-hidden="true"
          >


          <!-- 강아지.webp -->
          <img
            src="img/dog-character.webp"
            class="profile-dog"
            alt="강아지 캐릭터"
          >


        </div>



        <!-- 오른쪽 입력 영역 -->
        <div class="profile-form">


          <!-- 이름 -->
          <div class="profile-row">

            <div class="profile-label">

              <img
                src="img/paw-icon.webp"
                class="paw-icon"
                alt=""
                aria-hidden="true"
              >

              <label for="dogName">
                이름
              </label>

            </div>


            <div class="profile-input-area">

              <input
                type="text"
                id="dogName"
                maxlength="10"
                autocomplete="off"
              >

            </div>

          </div>



          <!-- 나이 -->
          <div class="profile-row">

            <div class="profile-label">

              <img
                src="img/paw-icon.webp"
                class="paw-icon"
                alt=""
                aria-hidden="true"
              >

              <label for="dogAge">
                나이
              </label>

            </div>


            <div class="profile-input-area input-small">

              <input
                type="number"
                id="dogAge"
                min="0"
                max="30"
              >

              <span class="profile-unit">
                살
              </span>

            </div>

          </div>



          <!-- 성별 -->
          <div class="profile-row">

            <div class="profile-label">

              <img
                src="img/paw-icon.webp"
                class="paw-icon"
                alt=""
                aria-hidden="true"
              >

              <span>
                성별
              </span>

            </div>


            <div class="gender-select">


              <button
                type="button"
                class="gender-choice"
                data-gender="male"
              >

                <span class="gender-heart male">
                  ♥
                </span>

                수컷

              </button>


              <button
                type="button"
                class="gender-choice"
                data-gender="female"
              >

                <span class="gender-heart female">
                  ♥
                </span>

                암컷

              </button>


            </div>

          </div>



          <!-- 몸무게 -->
          <div class="profile-row">

            <div class="profile-label">

              <img
                src="img/paw-icon.webp"
                class="paw-icon"
                alt=""
                aria-hidden="true"
              >

              <label for="dogWeight">
                몸무게
              </label>

            </div>


            <div class="profile-input-area input-small">

              <input
                type="number"
                id="dogWeight"
                min="0.1"
                max="100"
                step="0.1"
              >

              <span class="profile-unit">
                kg
              </span>

            </div>

          </div>


        </div>

      </div>



      <!-- 다음 버튼 -->
      <button
        type="button"
        class="profile-next-button"
        id="dogInfoNext"
      >
        시작하기
      </button>


    </section>

  </main>



  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const genderButtons =
          document.querySelectorAll(
            ".gender-choice"
          );

        const nextButton =
          document.getElementById(
            "dogInfoNext"
          );

        let selectedGender = null;


        /* 성별 선택 */

        genderButtons.forEach(
          function (button) {

            button.addEventListener(
              "click",
              function () {

                genderButtons.forEach(
                  function (item) {

                    item.classList.remove(
                      "selected"
                    );

                  }
                );


                button.classList.add(
                  "selected"
                );


                selectedGender =
                  button.dataset.gender;

              }
            );

          }
        );


        /* 다음 */

        nextButton.addEventListener(
          "click",
          function () {

            const dogName =
              document
                .getElementById("dogName")
                .value
                .trim();

            const dogAge =
              document
                .getElementById("dogAge")
                .value;

            const dogWeight =
              document
                .getElementById("dogWeight")
                .value;


            if (!dogName) {
              alert("강아지 이름을 입력해주세요!");
              return;
            }

            if (!dogAge) {
              alert("강아지 나이를 입력해주세요!");
              return;
            }

            if (!selectedGender) {
              alert("강아지 성별을 선택해주세요!");
              return;
            }

            if (!dogWeight) {
              alert("강아지 몸무게를 입력해주세요!");
              return;
            }


            sessionStorage.setItem(
              "dogName",
              dogName
            );

            sessionStorage.setItem(
              "dogAge",
              dogAge
            );

            sessionStorage.setItem(
              "dogGender",
              selectedGender
            );

            sessionStorage.setItem(
              "dogWeight",
              dogWeight
            );

            sessionStorage.setItem(
              "petStatus",
              "yes"
            );

            sessionStorage.setItem(
              "isVirtualDog",
              "false"
            );


            window.location.href =
              "question.html";

          }
        );

      }
    );

  </script>

<script src="audio.js"></script>

</body>
</html>
