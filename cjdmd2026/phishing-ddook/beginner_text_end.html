<head>

  <title>목소리 해설</title>

  <link rel="stylesheet" href="style.css">
  <script src="alpha-video.js"></script>

  <style>
    .video-container {
      z-index: 0;
    }

    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      display: block;
      background: transparent;
    }

  </style>

  <link rel="stylesheet" href="nav.css">
</head>

<body>

  <div class="video-container nav-safe-area">
    <video
      loop
      playsinline
      controls
    >
      <source
        src="mp3/Q2_V_b.mp4"
        type="video/mp4"
      >
    </video>
  </div>

  <div class="prev-wrap">
  <button class="prev-btn" onclick="location.href='beginner_text.html'" aria-label="이전">
    <span class="ic">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="#16263F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    이전
  </button>
</div>

  <div class="next-wrap">
  <button class="next-btn" onclick="location.href='index2.html'" aria-label="다음">
    다음
    <span class="ic">
      <svg viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="#16263F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
  </button>
</div>

<script>
  function fitVideo() {
    const box = document.querySelector('.video-container');
    const v = box && box.querySelector('video');
    if (!v) return;
    const r = box.getBoundingClientRect();
    const ar = (v.videoWidth && v.videoHeight) ? v.videoWidth / v.videoHeight : 16 / 9;
    let w = r.width, h = w / ar;
    if (h > r.height) { h = r.height; w = h * ar; }
    v.style.width = Math.floor(w) + 'px';
    v.style.height = Math.floor(h) + 'px';
  }
  fitVideo();
  window.addEventListener('resize', fitVideo);
  document.querySelector('.video-container video').addEventListener('loadedmetadata', fitVideo);

  window.addEventListener('load', () => {
    fitVideo();
    const v = document.querySelector('.video-container video');
    if (v) AlphaVideo.playWithFallback(v);
  });
</script>

</body>

</html>
