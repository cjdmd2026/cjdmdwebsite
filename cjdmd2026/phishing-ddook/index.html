<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
<link rel="icon" type="image/x-icon" href="img/favicon.ico">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff5c5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="피싱뚝">
<script src="alpha-video.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>목소리 선택</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    *{ margin:0; padding:0; box-sizing:border-box; font-family:'Pretendard', sans-serif; }

    @font-face {
      font-family: 'Isamanru';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-10@1.0/GongGothicLight.woff') format('woff');
      font-weight: 300;
      font-display: swap;
    }

    html, body{ height:100%; overflow:hidden; background:#EAF2FA; }

    .bg-layer{
      position:fixed;
      inset:-40px;
      background:url(img/background.webp) center/cover no-repeat;
      transition:transform .25s ease-out;
      z-index:0;
    }
    .bg-haze{
      position:fixed; inset:0; z-index:1; pointer-events:none;
      background:linear-gradient(180deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.15) 22%, rgba(255,255,255,0) 40%);
    }
    .bg-dof{
      position:fixed; left:0; right:0; bottom:0; height:22%; z-index:2; pointer-events:none;
      backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);
      -webkit-mask-image:linear-gradient(180deg, transparent 0%, #000 70%);
              mask-image:linear-gradient(180deg, transparent 0%, #000 70%);
    }
    .bg-vignette{
      position:fixed; inset:0; z-index:2; pointer-events:none;
      background:radial-gradient(ellipse 80% 70% at 50% 45%, rgba(0,0,0,0) 60%, rgba(20,40,70,0.18) 100%);
    }

    #scaleWrap{
      width:2800px; height:1575px;
      position:absolute; top:50%; left:50%;
      transform-origin:center center;
      z-index:5;
      transition:opacity .45s ease;
    }
    .container{
      width:2800px; height:1575px;
      display:flex; position:relative;
      align-items:center; justify-content:center;
    }
    .content{
      width:2560px; height:1420px;
      padding:70px 90px;
      display:flex; flex-direction:column;
      justify-content:center; align-items:center;
      position:relative;
    }

    .top-bar{
      width:100%;
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:20px;
      position:relative; z-index:10;
    }

    .phishing-badge{
      margin:0;
      background:#ff5c5c; color:#fff; border:none;
      border-radius:16px; font-size:34px; font-weight:700;
      padding:10px 40px; pointer-events:none;
      box-shadow:0 6px 16px rgba(255,92,92,0.3);
      position:relative; z-index:10;
    }

    .title-row{
      display:flex; align-items:center; justify-content:center;
      margin-bottom:50px;
      position:relative; z-index:10;
    }
    .title-row h1{
      text-align:center; font-size:108px; margin:0;
      font-family:'Isamanru'; font-weight:300;
      color:#16263F;
      text-shadow:0 0 24px rgba(255,255,255,0.9), 0 0 60px rgba(255,255,255,0.6);
    }

    .replay-btn{
      height:100px; padding:0 40px 0 18px;
      border-radius:50px; border:none;
      background:rgba(255,255,255,0.8);
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
      color:#16263F; font-size:34px; font-weight:700;
      display:flex; align-items:center; gap:16px;
      cursor:pointer; flex-shrink:0;
      box-shadow:0 8px 24px rgba(30,60,100,0.15), inset 0 0 0 2px rgba(255,255,255,0.9);
      transition:transform .15s ease, box-shadow .15s ease;
    }
    .replay-btn .ic{
      width:68px; height:68px; border-radius:50%;
      background:#ff5c5c; display:flex; align-items:center; justify-content:center;
    }
    .replay-btn svg{ width:36px; height:36px; }
    .replay-btn:hover{ transform:scale(1.05); }
    .replay-btn:active{ transform:scale(0.96); }

    .cards{
      position:relative; z-index:1;
      display:flex; justify-content:center; align-items:center;
      gap:0 50px; flex:1;
      transition:transform .25s ease-out;
    }

    #card1{ --c:#E8402F; --c-soft:rgba(232,64,47,0.12); --c-glow:rgba(232,64,47,0.38); }
    #card2{ --c:#3F5BD8; --c-soft:rgba(63,91,216,0.12); --c-glow:rgba(63,91,216,0.38); }
    #card3{ --c:#6A3FD1; --c-soft:rgba(106,63,209,0.12); --c-glow:rgba(106,63,209,0.38); }

    .s_card{
      position:relative;
      width:640px; height:1200px;
      display:flex; flex-direction:column;
      justify-content:flex-start; align-items:center;
      cursor:pointer;
      transition:transform .35s cubic-bezier(.34,1.4,.64,1), opacity .35s ease, filter .35s ease;
    }
    .s_card:hover{ transform:translateY(-8px) scale(1.02); }

    .image{ display:flex; align-items:flex-end; justify-content:center; position:relative; z-index:1; }
    #card1 .image, #card2 .image, #card3 .image{ width:100%; height:800px; }

    #card1 .image video, #card3 .image video{
      width:140%; height:100%;
      object-fit:contain; object-position:bottom center; background:transparent;
    }
    #card2 .image video{
      width:100%; height:100%;
      object-fit:contain; object-position:bottom center; background:transparent;
    }

    .image video{
      filter:drop-shadow(0 0 10px rgba(255,255,255,0.55)) drop-shadow(0 18px 24px rgba(20,40,70,0.18));
      transition:filter .35s ease;
    }

    #card1 .image, #card2 .image, #card3 .image{ animation:floatBobSmall 3.2s ease-in-out infinite; }
    #card1 .image{ animation-delay:0s; }
    #card2 .image{ animation-delay:.35s; }
    #card3 .image{ animation-delay:.7s; }

    @keyframes floatBobSmall{
      0%,100%{ transform:translateY(0); }
      50%    { transform:translateY(-16px); }
    }

    .foot-shadow{
      width:62%; height:46px; margin-top:-30px;
      border-radius:50%;
      background:radial-gradient(ellipse at center, rgba(40,30,20,0.45) 0%, rgba(40,30,20,0.2) 45%, rgba(40,30,20,0) 72%);
      filter:blur(4px);
      animation:shadowPulse 3.2s ease-in-out infinite;
      pointer-events:none;
      position:relative; z-index:0;
    }
    #card1 .foot-shadow{ animation-delay:0s; }
    #card2 .foot-shadow{ animation-delay:.35s; width:48%; }
    #card3 .foot-shadow{ animation-delay:.7s; }
    @keyframes shadowPulse{
      0%,100%{ transform:scale(1);   opacity:1; }
      50%    { transform:scale(.82); opacity:.65; }
    }

    .spotlight{
      position:absolute; left:50%; top:-240px;
      width:840px; height:1100px; margin-left:-420px;
      pointer-events:none; z-index:0;
      opacity:0; transform:scaleY(.8); transform-origin:top center;
      filter:blur(14px);
      transition:opacity .45s ease, transform .6s cubic-bezier(.22,1,.36,1);
    }
    .spotlight::before{
      content:''; position:absolute; inset:0;
      clip-path:polygon(41% 0, 59% 0, 100% 100%, 0 100%);
      background:linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.55) 45%, rgba(255,255,255,0) 100%);
    }
    .spotlight::after{
      content:''; position:absolute; left:50%; top:330px;
      width:640px; height:640px; margin-left:-320px; border-radius:50%;
      background:radial-gradient(circle, var(--c-glow) 0%, rgba(255,255,255,0) 68%);
    }
    .s_card.selected .spotlight{ opacity:1; transform:scaleY(1); }
    .s_card.selected .spotlight::before{ animation:spotBreath 2.6s ease-in-out infinite; }
    @keyframes spotBreath{
      0%,100%{ opacity:1; }
      50%    { opacity:.72; }
    }

    .sparkles{
      position:absolute; left:0; top:0; width:100%; height:800px;
      z-index:2; pointer-events:none;
    }
    .sparkles i{
      position:absolute; display:block;
      width:34px; height:34px;
      background:#FFC93C;
      clip-path:polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
      opacity:0; transform:scale(.3);
    }
    .sparkles i:nth-child(even){ background:var(--c); }
    .sparkles i:nth-child(1){ left:16%; top:24%; }
    .sparkles i:nth-child(2){ left:80%; top:16%; width:26px; height:26px; }
    .sparkles i:nth-child(3){ left:86%; top:50%; width:40px; height:40px; }
    .sparkles i:nth-child(4){ left:8%;  top:56%; width:24px; height:24px; }
    .sparkles i:nth-child(5){ left:62%; top:6%;  width:30px; height:30px; }
    .s_card.selected .sparkles i{ animation:twinkle 1.9s ease-in-out infinite; }
    .s_card.selected .sparkles i:nth-child(2){ animation-delay:.35s; }
    .s_card.selected .sparkles i:nth-child(3){ animation-delay:.8s; }
    .s_card.selected .sparkles i:nth-child(4){ animation-delay:1.1s; }
    .s_card.selected .sparkles i:nth-child(5){ animation-delay:.55s; }
    @keyframes twinkle{
      0%,100%{ opacity:0; transform:scale(.3) rotate(0deg); }
      45%    { opacity:1; transform:scale(1) rotate(20deg); }
      70%    { opacity:.2; transform:scale(.6) rotate(35deg); }
    }

    .foot-ring{
      position:absolute; top:768px; left:19%; width:62%; height:64px;
      border-radius:50%;
      border:5px solid var(--c);
      background:radial-gradient(ellipse at center, var(--c-soft) 0%, rgba(255,255,255,0) 70%);
      box-shadow:0 0 26px var(--c-glow), inset 0 0 20px var(--c-glow);
      opacity:0; transform:scale(.6);
      transition:opacity .35s ease, transform .45s cubic-bezier(.34,1.56,.64,1);
      pointer-events:none; z-index:0;
    }
    #card2 .foot-ring{ left:26%; width:48%; }
    .s_card.selected .foot-ring{
      opacity:1; transform:scale(1);
      animation:ringPulse 2.4s ease-in-out .45s infinite;
    }
    @keyframes ringPulse{
      0%,100%{ transform:scale(1);    opacity:1; }
      50%    { transform:scale(1.07); opacity:.7; }
    }

    .card-bottom{
      position:relative; z-index:2; width:100%;
      margin-top:14px;
      background:rgba(255,255,255,0.72);
      backdrop-filter:blur(14px) saturate(1.2);
      -webkit-backdrop-filter:blur(14px) saturate(1.2);
      border-radius:28px;
      display:grid;
      padding:14px 0 24px;
      box-shadow:0 18px 40px rgba(30,60,100,0.16), inset 0 0 0 2px rgba(255,255,255,0.9);
      transition:box-shadow .3s ease, background .3s ease;
    }
    .cb-info, .cb-actions{ grid-area:1 / 1; }

    .cb-info{
      display:flex; flex-direction:column; align-items:center;
      transition:opacity .25s ease, transform .3s ease, visibility 0s linear 0s;
    }
    .s_card.selected .cb-info{
      opacity:0; visibility:hidden; pointer-events:none;
      transform:translateY(-12px) scale(.96);
      transition:opacity .2s ease, transform .25s ease, visibility 0s linear .25s;
    }

    .voice-name{
      font-size:56px; font-weight:800; color:#16263F;
      margin:12px 0 8px; text-align:center;
    }
    .voice-desc{
      font-size:36px; color:#5E6B7A; text-align:center; margin-bottom:22px;
    }

    .preview-btn{
      width:88%; border:none; border-radius:18px;
      background:var(--c-soft); color:var(--c);
      font-size:36px; font-weight:700; cursor:pointer;
      display:flex; align-items:center; justify-content:center; gap:12px;
      padding:20px 0;
      transition:background .2s, color .2s, transform .15s;
    }
    .preview-btn svg{ width:40px; height:40px; }
    .preview-btn:hover{ background:var(--c); color:#fff; }
    .preview-btn:active{ transform:scale(.97); }
    .preview-btn.playing{ background:var(--c); color:#fff; }

    .cb-actions{
      justify-self:center; align-self:stretch;
      width:88%; margin-top:10px;
      display:flex; flex-direction:column; gap:6px;
      opacity:0; visibility:hidden; pointer-events:none;
      transform:scale(.88);
      transition:opacity .2s ease, transform .3s ease, visibility 0s linear .3s;
    }
    .s_card.selected .cb-actions{
      opacity:1; visibility:visible; pointer-events:auto;
      transform:scale(1);
      transition:opacity .28s ease .12s, transform .45s cubic-bezier(.34,1.56,.64,1) .12s, visibility 0s linear 0s;
    }
    .start-btn{
      flex:1; min-height:120px; width:100%;
      border:none; border-radius:24px;
      background:var(--c); color:#fff;
      display:flex; align-items:center; justify-content:center; gap:24px;
      font-size:54px; font-weight:800; letter-spacing:-0.5px;
      cursor:pointer;
      position:relative; overflow:hidden;
      box-shadow:0 14px 30px var(--c-glow);
      transition:transform .15s ease;
    }
    .s_card.selected .start-btn{
      animation:startPulse 1.8s ease-in-out .7s infinite;
    }
    .voice-btn{
      align-self:center;
      border:none; background:none;
      color:#8A94A3;
      font-size:28px; font-weight:600; cursor:pointer;
      display:flex; align-items:center; justify-content:center; gap:8px;
      padding:6px 16px;
      transition:color .2s, transform .15s;
    }
    .voice-btn svg{ width:30px; height:30px; }
    .voice-btn:active{ transform:scale(.96); color:#5E6B7A; }
    .voice-btn.playing{ color:#5E6B7A; }
    .s_card.selected .start-btn:active{ transform:scale(.97); }
    .start-btn::after{
      content:''; position:absolute; top:0; bottom:0; left:-40%; width:30%;
      background:linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.38) 50%, rgba(255,255,255,0) 100%);
      transform:skewX(-18deg);
      pointer-events:none;
    }
    .s_card.selected .start-btn::after{ animation:shine 2.6s ease-in-out .6s infinite; }
    .start-arrow{
      width:78px; height:78px; border-radius:50%;
      background:#fff; color:var(--c);
      display:flex; align-items:center; justify-content:center;
      flex-shrink:0;
    }
    .s_card.selected .start-arrow svg{ animation:arrowNudge 1.2s ease-in-out infinite; }
    @keyframes startPulse{
      0%,100%{ box-shadow:0 14px 30px var(--c-glow), 0 0 0 0 var(--c-glow); }
      50%    { box-shadow:0 14px 30px var(--c-glow), 0 0 0 18px rgba(255,255,255,0); }
    }
    @keyframes shine{
      0%       { left:-40%; }
      60%,100% { left:130%; }
    }
    @keyframes arrowNudge{
      0%,100%{ transform:translateX(0); }
      50%    { transform:translateX(6px); }
    }

    .cards.has-selection .s_card:not(.selected){
      opacity:.5; transform:scale(.94); filter:saturate(.6);
    }
    .s_card.selected{ transform:translateY(-14px) scale(1.04); }
    .s_card.selected .card-bottom{
      background:rgba(255,255,255,0.92);
      box-shadow:0 24px 50px rgba(30,60,100,0.22), inset 0 0 0 6px var(--c);
    }
    .s_card.selected .image video{
      filter:drop-shadow(0 0 18px rgba(255,255,255,0.9)) drop-shadow(0 0 40px rgba(255,255,255,0.6)) drop-shadow(0 18px 24px rgba(20,40,70,0.2));
    }
    .s_card.selected .foot-shadow{
      background:radial-gradient(ellipse at center, rgba(40,30,20,0.55) 0%, rgba(40,30,20,0.25) 45%, rgba(40,30,20,0) 72%);
    }

    .white-overlay{
      position:fixed; inset:0;
      background:rgba(255,255,255,0.65);
      backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
      opacity:0; pointer-events:none;
      transition:opacity .5s ease; z-index:200;
    }
    .white-overlay.active{ opacity:1; }

    .is-leaving #scaleWrap{ opacity:0; pointer-events:none; }
    .is-leaving .bg-layer{
      transform:scale(1.06) !important;
      transition:transform 1s cubic-bezier(.22,1,.36,1);
    }

    .flyer{
      position:fixed; left:0; top:0; width:0; height:0;
      z-index:300; pointer-events:none;
      transform-origin:0 0;
      opacity:0;
      will-change:transform;
    }
    .flyer.show{ opacity:1; }
    .flyer canvas{
      width:100%; height:100%; display:block;
      filter:drop-shadow(0 0 18px rgba(255,255,255,0.9)) drop-shadow(0 18px 30px rgba(20,40,70,0.18));
    }

    .stage{
      position:fixed; left:0; top:0; width:0; height:0;
      z-index:301; pointer-events:none;
      opacity:0; transition:opacity .25s ease;
    }
    .stage.show{ opacity:1; }
    .stage video{
      width:100%; height:100%; display:block;
      object-fit:contain; object-position:50% 100%;
      filter:drop-shadow(0 0 18px rgba(255,255,255,0.9)) drop-shadow(0 18px 30px rgba(20,40,70,0.18));
    }

    .speech{
      --s:1; --c:#ff5c5c;
      position:fixed; left:0; top:0; z-index:302;
      pointer-events:none;
      transform:translate(-50%, calc(-100% - 34px * var(--s))) scale(.6);
      transform-origin:50% 100%;
      opacity:0;
      transition:opacity .25s ease, transform .45s cubic-bezier(.34,1.56,.64,1);
    }
    .speech.show{ opacity:1; transform:translate(-50%, calc(-100% - 34px * var(--s))) scale(1); }
    .speech-text{
      position:relative;
      background:#fff; color:#16263F;
      font-size:calc(64px * var(--s)); font-weight:800;
      line-height:1.4; letter-spacing:-0.5px;
      text-align:center; white-space:nowrap;
      padding:calc(30px * var(--s)) calc(56px * var(--s));
      border-radius:calc(46px * var(--s));
      border:calc(6px * var(--s)) solid var(--c);
      box-shadow:0 calc(16px * var(--s)) calc(40px * var(--s)) rgba(30,60,100,0.2);
    }
    .speech-text::before,
    .speech-text::after{
      content:''; position:absolute; left:50%;
      width:0; height:0;
      border-left:solid transparent; border-right:solid transparent; border-top:solid;
    }
    .speech-text::before{
      bottom:calc(-34px * var(--s));
      margin-left:calc(-28px * var(--s));
      border-left-width:calc(28px * var(--s));
      border-right-width:calc(28px * var(--s));
      border-top-width:calc(34px * var(--s));
      border-top-color:var(--c);
    }
    .speech-text::after{
      bottom:calc(-24px * var(--s));
      margin-left:calc(-20px * var(--s));
      border-left-width:calc(20px * var(--s));
      border-right-width:calc(20px * var(--s));
      border-top-width:calc(26px * var(--s));
      border-top-color:#fff;
    }
    .speech .ch{
      display:inline-block;
      opacity:0; transform:translateY(.3em);
      transition:opacity .15s ease, transform .22s cubic-bezier(.34,1.56,.64,1);
    }
    .speech .ch.on{ opacity:1; transform:translateY(0); }

    .page-fade{
      position:fixed; inset:0; z-index:1000;
      background:#fff;
      opacity:0; pointer-events:none;
      transition:opacity .34s ease-in;
    }
    .page-fade.on{ opacity:1; pointer-events:auto; }
  </style>
<style id="tabfix">
  html, body { width:100%; height:100%; margin:0; overflow:hidden; overscroll-behavior:none; }
  #scaleWrap { position:fixed !important; }
</style>
</head>

<body>

  <div class="bg-layer" id="bgLayer"></div>
  <div class="bg-haze"></div>
  <div class="bg-vignette"></div>
  <div class="bg-dof"></div>

  <div id="scaleWrap">
    <div class="container">
      <div class="content">

        <div class="top-bar">
          <button class="phishing-badge">피싱뚝</button>
          <button class="replay-btn" onclick="playGuideVoice()" aria-label="안내 다시 듣기">
            <span class="ic">
              <svg viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#fff"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
            </span>
            안내 다시 듣기
          </button>
        </div>

        <div class="title-row">
          <h1>함께 학습할 목소리를 골라주세요</h1>
        </div>

        <div class="cards" id="cards">

          <div class="s_card" id="card1" onclick="chooseCard('1')">
            <div class="spotlight"></div>
            <div class="image">
              <video id="previewVideo1" class="preview-video" data-alpha-src="mp3/ddoddo_v.webm" playsinline preload="auto"></video>
            </div>
            <div class="sparkles"><i></i><i></i><i></i><i></i><i></i></div>
            <div class="foot-shadow"></div>
            <div class="foot-ring"></div>
            <div class="card-bottom">
              <div class="cb-info">
                <div class="voice-name">뚜뚜</div>
                <div class="voice-desc">차분하고 든든한 목소리</div>
                <button class="preview-btn" onclick="event.stopPropagation(); chooseCard('1')">
                  <svg viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 010 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                  미리 듣기
                </button>
              </div>
              <div class="cb-actions">
                <button class="start-btn" onclick="confirmSelection(event)">
                  <span class="start-label">뚜뚜와 시작하기</span>
                  <span class="start-arrow">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>

          <div class="s_card" id="card2" onclick="chooseCard('2')">

              <video id="previewVideo2" class="preview-video" data-alpha-src="mp3/bbibbo_v.webm" playsinline preload="auto"></video>

                  <svg viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 010 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>

            </div>
            <div class="sparkles"><i></i><i></i><i></i><i></i><i></i></div>
            <div class="foot-shadow"></div>

            <div class="card-bottom">
              <div class="cb-info">
                <div class="voice-name">감쪽</div>
                <div class="voice-desc">밝고 활기찬 목소리</div>
                <button class="preview-btn" onclick="event.stopPropagation(); chooseCard('3')">
                  <svg viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 010 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>

                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>

                <button class="voice-btn" onclick="replayVoice(event)">
                  <svg viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>

  <div class="white-overlay" id="whiteOverlay"></div>
  <div class="flyer" id="flyer"><canvas id="flyerCanvas"></canvas></div>
  <div class="stage" id="stage"><video id="revealVideo" playsinline preload="auto"></video></div>
  <div class="speech" id="speech" aria-live="polite"><div class="speech-text" id="speechText"></div></div>
  <div class="page-fade" id="pageFade"></div>

  <script type="module">
    import { setField } from "./session.js";
    window.__setField = setField;
  </script>

  <script>
    const voiceMap = {
      '1': { name: 'ddoddo',   ko: '뚜뚜' },
      '2': { name: 'bbibbo',   ko: '삐뽀' },
      '3': { name: 'gamjjock', ko: '감쪽' }
    };

    const nextVideoMap = {
      '1': 'video/ddoddo_index1.webm',
      '2': 'video/bbibbo_index1.webm',
      '3': 'video/gamjjock_index1.webm'
    };
    const NEXT_PAGE = 'index1.html';

    const NEXT_STAGE = { canvasW: 2850, canvasH: 1575, left: 700, bottom: -400, height: 1500 };

    const STAGE_TUNE = {
      '1': { x: 0, y: -60, scale: 1 },
      '2': { x: 0, y: -150, scale: 1 },
      '3': { x: 0, y: 0, scale: 1 }
    };

    const REVEAL_TUNE = {
      '1': { x: 0, y: -90, scale: 1.1 },
      '2': { x: 0, y: -150, scale: 1 },
      '3': { x: 0, y: 0,   scale: 1 }
    };

    const SPEECH_TEXT = '날 골라줘서 고마워요!\n함께 공부해요!';
    const SPEECH_TYPE_MS = 2000;
    const SPEECH_POS = {
      '1': { x: 0, y: 300 },
      '2': { x: 0, y: 500 },
      '3': { x: 0, y: 80 }
    };
    const SPEECH_SCALE = 1;
    const NO_TUNE = { x: 0, y: 0, scale: 1 };

    const FLY_MS = 850;
    const FADE_OUT_MS = 340;

    const revealSrc = name => `mp3/${name}_v_s.webm`;

    let currentAudio = null;
    let selectedIndex = null;
    let leaving = false;
    let finishing = false;
    let savePromise = Promise.resolve();
    let stageRect = null;
    let revealRect = null;
    let speechTimers = [];
    let stageAspect = 1;
    let flyAspect = null;
    let flyerLanded = false;

    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const withTimeout = (p, ms, fallback = null) => Promise.race([p, sleep(ms).then(() => fallback)]);

    function placeBox(el, r){
      el.style.left   = r.left + 'px';
      el.style.top    = r.top + 'px';
      el.style.width  = r.width + 'px';
      el.style.height = r.height + 'px';
    }

    function fitBottom(box, aspect){
      let w = box.width, h = w / aspect;
      if (h > box.height){ h = box.height; w = h * aspect; }
      return { left: box.left + (box.width - w) / 2, top: box.top + box.height - h, width: w, height: h };
    }

    function stageScale(){
      return Math.min(window.innerWidth / NEXT_STAGE.canvasW, window.innerHeight / NEXT_STAGE.canvasH);
    }

    function applyTune(box, t, s){
      const w = box.width * t.scale, h = box.height * t.scale;
      return {
        left: box.left + (box.width - w) / 2 + t.x * s,
        top:  box.top + (box.height - h) + t.y * s,
        width: w, height: h
      };
    }

    function computeStageRect(index, aspect){
      const W = window.innerWidth, H = window.innerHeight;
      const S = NEXT_STAGE;
      const s = stageScale();
      const originX = (W - S.canvasW * s) / 2;
      const originY = (H - S.canvasH * s) / 2;
      const h = S.height * s;
      const box = {
        left: originX + S.left * s,
        top:  originY + (S.canvasH - S.bottom - S.height) * s,
        width: h * aspect,
        height: h
      };
      return applyTune(box, STAGE_TUNE[index] || NO_TUNE, s);
    }

    const preloaded = {};
    function preloadVideo(src){
      if (preloaded[src]) return preloaded[src];
      const v = document.createElement('video');
      v.muted = true; v.preload = 'auto'; v.playsInline = true;
      const entry = { el: v, aspect: null };
      entry.ready = new Promise(resolve => {
        v.addEventListener('loadedmetadata', () => {
          entry.aspect = AlphaVideo.aspect(v);
          resolve(entry.aspect);
        }, { once: true });
        v.addEventListener('error', () => resolve(null), { once: true });
      });
      v.src = AlphaVideo.url(src);
      preloaded[src] = entry;
      return entry;
    }
    function preloadFor(index){
      const info = voiceMap[index];
      if (!info) return;
      preloadVideo(nextVideoMap[index]);
      preloadVideo(revealSrc(info.name));
    }

    function waitCanPlay(v){
      if (v.readyState >= 3) return Promise.resolve();
      return new Promise(r => {
        v.addEventListener('canplay', r, { once: true });
        v.addEventListener('error', r, { once: true });
      });
    }

    function clearPlayingBtns(){
      document.querySelectorAll('.preview-btn, .voice-btn').forEach(b => b.classList.remove('playing'));
    }

    function playAudio(src) {
      if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
      pauseAllPreviewVideos();
      currentAudio = new Audio(src);
      const p = currentAudio.play();
      if (p !== undefined) p.catch(err => console.log('Audio play interrupted:', err));
      return currentAudio;
    }

    function playGuideVoice() {
      if (leaving) return;
      playAudio('mp3/voice_1.mp3');
    }

    function initGuideVoiceAutoplay() {
      pauseAllPreviewVideos();
      currentAudio = new Audio('mp3/voice_1.mp3');
      const p = currentAudio.play();
      if (p !== undefined) {
        p.catch(() => {
          let played = false;
          const once = (e) => {
            if (played) return;
            played = true;
            document.removeEventListener('touchstart', once);
            document.removeEventListener('click', once);
            if (selectedIndex || (e && e.target && e.target.closest && e.target.closest('.s_card'))) return;
            playGuideVoice();
          };
          document.addEventListener('touchstart', once);
          document.addEventListener('click', once);
        });
      }
    }

    function pauseAllPreviewVideos() {
      document.querySelectorAll('.preview-video').forEach(v => v.pause());
      clearPlayingBtns();
    }

    function initPreviewVideos() {
      document.querySelectorAll('.preview-video').forEach(video => {
        video.loop = false;
        video.muted = false;
        const showFirstFrame = () => { try { video.currentTime = 0.01; } catch (e) {} };
        if (video.readyState >= 1) showFirstFrame();
        else video.addEventListener('loadedmetadata', showFirstFrame, { once: true });
        video.addEventListener('ended', clearPlayingBtns);
      });
    }

    function chooseCard(index) {
      if (leaving) return;
      if (selectedIndex === index) return;
      selectedIndex = index;
      document.querySelectorAll('.s_card').forEach(c => {
        const on = c.id === 'card' + index;
        c.classList.toggle('selected', on);
      });
      document.getElementById('cards').classList.add('has-selection');
      preloadFor(index);
      playCardVoice(index);
    }

    function playCardVoice(index) {
      const video = document.getElementById('previewVideo' + index);
      const card = document.getElementById('card' + index);
      if (!video) return;
      if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
      document.querySelectorAll('.preview-video').forEach(v => { if (v !== video) v.pause(); });
      clearPlayingBtns();
      const vb = card && card.querySelector('.voice-btn');
      if (vb) vb.classList.add('playing');
      try { video.currentTime = 0; } catch (e) {}
      video.loop = false;
      video.play().catch(err => console.log('Video play interrupted:', err));
    }

    function replayVoice(e) {
      if (e) e.stopPropagation();
      if (leaving || !selectedIndex) return;
      playCardVoice(selectedIndex);
    }

    function resetToFirstFrame(v){
      if (!v || v.readyState < 1) return Promise.resolve();
      if (Math.abs(v.currentTime - 0.01) < 0.02) return Promise.resolve();
      const done = new Promise(r => v.addEventListener('seeked', r, { once: true }));
      try { v.currentTime = 0.01; } catch (e) { return Promise.resolve(); }
      return withTimeout(done, 300);
    }

    function snapshotFrame(v){
      const f = AlphaVideo.frame(v);
      if (!f) return null;
      const c = document.getElementById('flyerCanvas');
      c.width = f.width;
      c.height = f.height;
      try { c.getContext('2d').drawImage(f.source, 0, 0, c.width, c.height); }
      catch (e) { return null; }
      return { aspect: f.width / f.height };
    }

    function layoutStage(){
      if (!selectedIndex) return;
      const s = stageScale();
      stageRect  = computeStageRect(selectedIndex, stageAspect);
      revealRect = applyTune(stageRect, REVEAL_TUNE[selectedIndex] || NO_TUNE, s);
      placeBox(document.getElementById('stage'), revealRect);
      if (flyerLanded && flyAspect) placeBox(document.getElementById('flyer'), fitBottom(stageRect, flyAspect));
      placeSpeech();
    }

    function buildSpeech(){
      const box = document.getElementById('speechText');
      box.innerHTML = '';
      Array.from(SPEECH_TEXT).forEach(ch => {
        if (ch === '\n') { box.appendChild(document.createElement('br')); return; }
        const span = document.createElement('span');
        span.className = 'ch';
        span.textContent = ch === ' ' ? '\u00A0' : ch;
        box.appendChild(span);
      });
    }

    function placeSpeech(){
      const speech = document.getElementById('speech');
      if (!revealRect || !selectedIndex) return;
      const s = stageScale();
      const p = SPEECH_POS[selectedIndex] || { x: 0, y: 80 };
      const bs = s * SPEECH_SCALE;
      speech.style.setProperty('--s', bs);
      const w = speech.offsetWidth;
      const h = speech.offsetHeight + 34 * bs;
      let x = revealRect.left + revealRect.width / 2 + p.x * s;
      let y = revealRect.top + p.y * s;

      const minX = w / 2 + 8, maxX = window.innerWidth - w / 2 - 8, minY = h + 8;
      if (x < minX || x > maxX) {
        console.warn('[말풍선] 좌우가 화면 밖이라 x 위치를 안쪽으로 고정했어요.');
        x = Math.min(Math.max(x, minX), maxX);
      }
      if (y < minY) {
        console.warn(`[말풍선] 화면 위로 잘려서 y 위치를 고정했어요. 더 올리려면 SPEECH_SCALE을 줄여주세요. (요청 ${Math.round(y)}px → 최소 ${Math.round(minY)}px)`);
        y = minY;
      }
      speech.style.left = x + 'px';
      speech.style.top  = y + 'px';
    }

    function showSpeech(index){
      const speech = document.getElementById('speech');
      const card = document.getElementById('card' + index);
      const color = card ? getComputedStyle(card).getPropertyValue('--c').trim() : '';
      if (color) speech.style.setProperty('--c', color);
      buildSpeech();
      placeSpeech();
      speech.classList.add('show');

      const chars = speech.querySelectorAll('.ch');
      const step = chars.length > 1 ? SPEECH_TYPE_MS / (chars.length - 1) : 0;
      speechTimers.forEach(clearTimeout);
      speechTimers = Array.from(chars).map((c, i) =>
        setTimeout(() => c.classList.add('on'), 200 + i * step)
      );
    }

    function flyTo(from){
      const flyer = document.getElementById('flyer');
      const to = fitBottom(stageRect, flyAspect);
      placeBox(flyer, to);
      const k = from.width / to.width;
      const anim = flyer.animate([
        { transform: `translate(${from.left - to.left}px, ${from.top - to.top}px) scale(${k})` },
        { transform: 'translate(0px, 0px) scale(1)' }
      ], { duration: FLY_MS, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'both' });
      return anim.finished.then(() => { flyerLanded = true; }).catch(() => {});
    }

    async function confirmSelection(e) {
      if (e) e.stopPropagation();
      if (leaving || !selectedIndex || !voiceMap[selectedIndex]) return;
      leaving = true;

      const index = selectedIndex;
      const info = voiceMap[index];

      sessionStorage.setItem('voiceIndex', index);
      if (window.__setField) {
        savePromise = window.__setField('characterType', info.ko)
          .catch(err => console.log('캐릭터 유형 저장 실패:', err));
      }

      if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
      pauseAllPreviewVideos();

      const revealVideo = document.getElementById('revealVideo');
      revealVideo.loop = false;
      revealVideo.muted = false;
      revealVideo.onended = finishAndGo;
      revealVideo.onerror = finishAndGo;
      AlphaVideo.setSrc(revealVideo, revealSrc(info.name));
      revealVideo.load();

      const srcVideo = document.getElementById('previewVideo' + index);
      await resetToFirstFrame(srcVideo);
      const snap = snapshotFrame(srcVideo);
      const flyer = document.getElementById('flyer');
      let fromRect = null;
      if (snap) {
        flyAspect = snap.aspect;
        fromRect = fitBottom(srcVideo.getBoundingClientRect(), flyAspect);
        placeBox(flyer, fromRect);
        flyer.classList.add('show');
        srcVideo.style.visibility = 'hidden';
      }

      document.body.classList.add('is-leaving');
      document.getElementById('whiteOverlay').classList.add('active');

      const nextAspect = await withTimeout(preloadVideo(nextVideoMap[index]).ready, 600);
      stageAspect = nextAspect || preloadVideo(revealSrc(info.name)).aspect || flyAspect || 1;
      layoutStage();

      const flight = snap ? flyTo(fromRect) : Promise.resolve();
      await Promise.all([flight, withTimeout(waitCanPlay(revealVideo), 2500)]);
      if (finishing) return;

      try {
        await revealVideo.play();
      } catch (err) {
        console.log('Reveal video play interrupted:', err);
        finishAndGo();
        return;
      }
      document.getElementById('stage').classList.add('show');
      setTimeout(() => flyer.classList.remove('show'), 260);
      showSpeech(index);
    }

    async function finishAndGo() {
      if (finishing) return;
      finishing = true;
      leaving = true;
      await withTimeout(savePromise, 1500);
      document.getElementById('pageFade').classList.add('on');
      await sleep(FADE_OUT_MS);
      location.href = NEXT_PAGE;
    }

    const bgLayer = document.getElementById('bgLayer');
    const cardsEl = document.getElementById('cards');
    window.addEventListener('mousemove', (e) => {
      if (leaving) return;
      const x = (e.clientX / window.innerWidth  - 0.5);
      const y = (e.clientY / window.innerHeight - 0.5);
      bgLayer.style.transform = `translate(${x * -24}px, ${y * -14}px) scale(1.02)`;
      cardsEl.style.transform = `translate(${x * 18}px, ${y * 8}px)`;
    });

    function fitScale() {
      const scale = Math.min(window.innerWidth / 2800, window.innerHeight / 1575);
      document.getElementById('scaleWrap').style.transform = `translate(-50%, -50%) scale(${scale})`;
    }
    window.addEventListener('resize', () => {
      fitScale();
      if (leaving && stageRect) layoutStage();
    });
    window.addEventListener('load', fitScale);

    window.addEventListener('pageshow', (e) => { if (e.persisted) location.reload(); });

    fitScale();
    AlphaVideo.scan();
    try { ['urgency','trust','action','verify','repeat'].forEach(k => sessionStorage.removeItem('score_' + k)); } catch (e) {}
    initPreviewVideos();
    initGuideVoiceAutoplay();
  </script>
