    <link rel="stylesheet" href="style3.css">
    <style>

body {
  background-image: url("img/background3.webp");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

    @keyframes drift{
      0%,100%{ transform:translateY(0) translateX(0); }
      50%{ transform:translateY(-26px) translateX(18px); }
    }

    @keyframes fadeSlideLeft{
      from{ opacity:0; transform:translateX(-40px); }
      to{ opacity:1; transform:translateX(0); }
    }
    @keyframes fadeSlideRight{
      from{ opacity:0; transform:translateX(40px); }
      to{ opacity:1; transform:translateX(0); }
    }

    .image-box{
      animation: fadeSlideLeft 0.6s ease-out both;
    }

    .question-area{
      animation: fadeSlideRight 0.6s ease-out 0.12s both;
    }

    .question-img{
      animation: floatY 3.6s ease-in-out infinite;
      animation-delay: 0.6s;
    }

    .dot{
      transition: background 0.3s ease, transform 0.3s ease;
    }

    @keyframes dotPulse{
      0%,100%{ box-shadow: 0 0 0 0 rgba(255,92,92,0.5); }
      50%{ box-shadow: 0 0 0 7px rgba(255,92,92,0); }
    }

    .dot.active{
      animation: dotPulse 1.6s ease-in-out infinite;
    }

    .answer-btn{
      position:relative;
      overflow:hidden;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .answer-btn:hover{
      transform: translateY(-3px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.08);
    }

    @keyframes btnPop{
      0%{ transform: scale(1); }
      40%{ transform: scale(0.94); }
      100%{ transform: scale(1); }
    }

    .answer-btn.pop{
      animation: btnPop 0.28s ease;
    }

    @keyframes checkPop{
      from{ transform:translateY(-50%) scale(0); opacity:0; }
      to{ transform:translateY(-50%) scale(1); opacity:1; }
    }

    .answer-btn.selected::after{
      content:'✓';
      position:absolute;
      right:18px;
      top:50%;
      color:#34c759;
      font-weight:800;
      font-size:22px;
      animation: checkPop 0.35s cubic-bezier(.34,1.56,.64,1) forwards;
    }

    @keyframes readyPulse{
      0%,100%{ box-shadow: 0 0 0 0 rgba(255,92,92,0.5); }
      50%{ box-shadow: 0 0 0 12px rgba(255,92,92,0); }
    }

    .next-btn.ready{
      animation: readyPulse 1.4s ease-in-out infinite;
    }

    @keyframes shimmer{
      0%{ transform:translateX(-100%); }
      100%{ transform:translateX(100%); }
    }

    @keyframes modalShake{
      0%,100%{ transform:translateX(0); }
      20%{ transform:translateX(-8px); }
      40%{ transform:translateX(8px); }
      60%{ transform:translateX(-5px); }
      80%{ transform:translateX(5px); }
    }

    .modal-box.shake{
      animation: modalShake 0.4s ease-in-out;
    }

    </style>
  <link rel="stylesheet" href="nav.css">
<style id="testfit">
  html, body { width:100%; height:100%; margin:0; overflow:hidden; overscroll-behavior:none; }
  #testCanvas {
    position:fixed; left:50%; top:50%;
    width:2130px; height:1150px;
    transform-origin:center center;
    transform:translate(-50%,-50%) scale(var(--fit, 1));
  }
  #testCanvas .question-container { min-height:100%; }
  #testCanvas .question-area { width:660px; }
</style>
</head>

<body>

    <div id="testCanvas">
    <main class="question-container">
        <div class="image-box">
            <img src="img/test2.webp" alt="문항 이미지" class="question-img">
        </div>

        <div class="question-area">
            <div class="progress-wrap">
                <span class="dot done"></span>
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>

            <h2 class="question">
                2.전화가 와서 받아보니 <br>
                검찰이나 은행, 공공기관이라고<br>
                소개하면 어떻게 하시겠습니까?
            </h2>

            <div class="answer-wrap">
                <button class="answer-btn">
                    기관이라고 하니 믿고 전화한다
                </button>

                <button class="answer-btn">
                    어떤 일인지 자세히 물어본다
                </button>

                <button class="answer-btn">
                    공식 번호인지 먼저 확인한다
                </button>
            </div>
        </div>
    </main>
    </div>
<script>
  (function(){
    function fitTestCanvas(){
      var c = document.getElementById('testCanvas');
      if (!c) return;
      var s = Math.min(window.innerWidth / 2130, window.innerHeight / 1150);
      c.style.setProperty('--fit', s);
    }
    fitTestCanvas();
    window.addEventListener('resize', fitTestCanvas);
    window.addEventListener('orientationchange', fitTestCanvas);
  })();
</script>

<div class="prev-wrap">
  <button class="prev-btn" onclick="location.href='test1.html'" aria-label="이전">
    <span class="ic">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="#16263F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    이전
  </button>
</div>

<div class="next-wrap">
  <button id="nextBtn" class="next-btn" aria-label="다음">
    다음
    <span class="ic">
      <svg viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="#16263F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
  </button>
</div>

    <div id="modal" class="modal">
        <div class="modal-box">
            <p>답변을 선택해주세요</p>
    
            <button onclick="closeModal()">
                확인
            </button>
        </div>
    </div>
  
<script type="module">
  import { logAction, setField, setScore } from "./session.js";
  window.__logAction = logAction;
  window.__setField = setField;
  window.__setScore = setScore;
</script>

<script>
          const voiceMap = {
  '1': 'mp3/test2_ddoddo.mp3',
  '2': 'mp3/test2_bbibbo.mp3',
  '3': 'mp3/test2_gamjjock.mp3'
};

const voiceIndex = sessionStorage.getItem('voiceIndex') || '1';
const voiceFile = voiceMap[voiceIndex];

let currentAudio = null;

function playAudio(src) {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
  }
  currentAudio = new Audio(src);
  currentAudio.play().catch(err => {
    console.log('Audio play error:', err);
  });
  return currentAudio;
}

window.addEventListener('load', function() {
  playGuideVoice();
});

function playGuideVoice() {
  if (!voiceFile) return;
  playAudio(voiceFile);
}

        const answerButtons =
            document.querySelectorAll('.answer-btn');
        
        const nextBtn =
            document.getElementById('nextBtn');
        
        let selectedAnswer = null;
        let selectedAnswerIndex = null;
        
        answerButtons.forEach((button, index) => {
        
            button.addEventListener('click', () => {
        
                answerButtons.forEach(btn => {
                    btn.classList.remove('selected');
                });
        
                button.classList.add('selected');

                button.classList.remove('pop');
                void button.offsetWidth;
                button.classList.add('pop');
        
                selectedAnswer =
                    button.textContent.trim();
                selectedAnswerIndex = index;

                nextBtn.classList.add('ready');
        
            });
        
        });
        
        nextBtn.addEventListener('click', async () => {
        
            if(!selectedAnswer){
        
                openModal();
                return;
        
            }
        
            localStorage.setItem(
                'test2Answer',
                selectedAnswer
            );

            if (window.__logAction) {
                const levels = ['danger', 'neutral', 'safe'];
                try {
                    await window.__logAction(
                        '기관 사칭 전화',
                        selectedAnswer,
                        levels[selectedAnswerIndex] || 'neutral'
                    );
                } catch (err) {
                    console.log('행동 기록 실패:', err);
                }
            }

            const trustPoints = [5, 3, 2];
            try { sessionStorage.setItem('score_trust', String(trustPoints[selectedAnswerIndex] ?? 0)); } catch (e) {}
            if (window.__setScore) {
                try {
                    await window.__setScore('trust', trustPoints[selectedAnswerIndex] ?? 0);
                } catch (err) {
                    console.log('점수 기록 실패:', err);
                }
            }
        
            window.location.href = 'test3.html';
        
        });

        function openModal(){
        const modal = document.getElementById('modal');
        const modalBox = document.getElementById('modalBox');

        modal.style.display='flex';

        modalBox.classList.remove('shake');
        void modalBox.offsetWidth;
        modalBox.classList.add('shake');
        }

        function closeModal(){
        document.getElementById('modal').style.display='none';
        }
        </script>

</body>
</html>
