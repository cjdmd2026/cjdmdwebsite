
<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="img/favicon.ico">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#239fdd">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="피싱뚝">

<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>기본 정보 입력</title>

<link rel="stylesheet" href="style.css">

<style>

  body{
    background-image: url("img/background3.webp");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

    .top-bar{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:20px;
      position:relative;
      z-index:10;
    }

    .character-reveal img.single{

      width:100%;

      display:block;

    }

    .info-box{

      transform:translateY(30px);

      width:100%;

      display:flex;

      flex-direction:column;

      align-items:center;

    }

    .name-gender-row{

      width:1800px;

      display:flex;

      align-items:flex-start;

      gap:30px;

      margin-bottom:10px;

    }

    .name-group,

    .gender-group{

      margin-bottom:0;

    }

    .name-group{

      flex:0 0 600px;

      width:600px;

    }

    .name-group .info-input{

      width:600px;

    }

    .gender-group{

      flex:1;

      width:auto;

    }

    .gender-group .choice-wrap{

      width:100%;

    }

    .info-group{

      width:1800px;

      display:flex;

      flex-direction:column;

      gap:20px;

      margin-bottom:60px;

    }

    .info-group label{

      font-size:50px;

      font-weight:700;

      color:#333;

      text-align:left;

      display:flex;

      align-items:center;

      gap:14px;

    }

    .info-input{

      height:100px;

      border:3px solid #239fdd;

      border-radius:18px;

      padding:0 28px;

      font-size:50px;

      background:#fff;

      color:#000;

      outline:none;

      box-sizing:border-box;

    }

    .info-input:not(:placeholder-shown){

      background:#90e0ff2a;

    }

    .info-input:-webkit-autofill,
    .info-input:-webkit-autofill:hover,
    .info-input:-webkit-autofill:focus{

      -webkit-box-shadow:0 0 0 1000px #beedff inset;

      box-shadow:0 0 0 1000px #beedff inset;

      -webkit-text-fill-color:#000;

    }

    .choice-wrap{

      display:grid;

      grid-template-columns:repeat(4,1fr);

      gap:20px;

    }

    .choice-wrap.two-col{

      grid-template-columns:repeat(2,1fr);

    }

    .choice-btn{

      height:100px;

      border:3px solid #239fdd;

      border-radius:18px;

      background:#fff;

      font-size:45px;

      font-weight:700;

      color:#333;

      cursor:pointer;

      transition:transform .15s ease, box-shadow .15s ease;

    }

    .choice-btn:hover{

      transform:translateY(-3px);

      box-shadow:0 6px 14px rgba(35,159,221,0.18);

    }

    @keyframes btnPop{

      0%{ transform:scale(1); }

      40%{ transform:scale(0.92); }

      100%{ transform:scale(1); }

    }

    .choice-btn.pop{

      animation:btnPop 0.28s ease;

    }

    .choice-btn.selected{

      background:#90e0ff95;

      color:#000;

    }

    .check-badge{

      display:inline-flex;

      align-items:center;

      justify-content:center;

      width:40px;

      height:40px;

      border-radius:50%;

      background:#34c759;

      color:#fff;

      font-size:24px;

      font-weight:800;

      opacity:0;

      transform:scale(0.4);

      transition:opacity 0.2s ease, transform 0.2s ease;

    }

    .check-badge.show{

      opacity:1;

      transform:scale(1);

      animation: bouncePop 0.5s cubic-bezier(.34,1.56,.64,1);

    }

    @keyframes bouncePop{

      0%{ transform:scale(0.4); opacity:0; }

      60%{ transform:scale(1.25); opacity:1; }

      100%{ transform:scale(1); }

    }

    @keyframes readyPulse{

      0%,100%{ box-shadow: 0 0 0 0 rgba(35,159,221,0.5); }

      50%{ box-shadow: 0 0 0 14px rgba(35,159,221,0); }

    }

    .next-btn.ready{

      animation: readyPulse 1.4s ease-in-out infinite;

    }

    @keyframes modalShake{

      0%,100%{ transform:translateX(0); }

      20%{ transform:translateX(-8px); }

      40%{ transform:translateX(8px); }

      60%{ transform:translateX(-5px); }

      80%{ transform:translateX(5px); }

    }

    .modal-box.shake{

      animation: modalShake 0.4s ease-in-out;

    }

</style>

  <link rel="stylesheet" href="nav.css">
<style id="tabfix">
  html, body { width:100%; height:100%; margin:0; overflow:hidden; overscroll-behavior:none; }
  #scaleWrap { position:fixed !important; }
</style>
</head>

<body>

  <div id="scaleWrap">

    <div class="container">

      <div class="content">

        <div class="top-bar">
          <button class="phishing-badge">피싱뚝</button>
          <div class="replay-wrap">
            <button class="replay-btn" onclick="playGuideVoice()" aria-label="안내 다시 듣기">
              <span class="ic">
                <svg viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#fff"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
              </span>
              안내 다시 듣기
            </button>
          </div>
        </div>

        <div class="title-row">
          <h1>기본 정보를 입력해주세요</h1>
        </div>

        <div class="info-box">

          <div class="name-gender-row">

            <div class="info-group name-group">

              <label>이름 <span class="check-badge" id="nameCheck">✓</span></label>

              <input type="text" id="nameInput" class="info-input" placeholder="이름을 입력해주세요" autocomplete="off">

            </div>

            <div class="info-group gender-group">

              <label>성별 <span class="check-badge" id="genderCheck">✓</span></label>

              <div class="choice-wrap two-col" id="genderWrap">

                <button class="choice-btn">남성</button>

                <button class="choice-btn">여성</button>

              </div>

            </div>

          </div>

          <div class="info-group">

            <label>나이 <span class="check-badge" id="ageCheck">✓</span></label>

            <div class="choice-wrap" id="ageWrap">

              <button class="choice-btn">80대 이상</button>

              <button class="choice-btn">70대</button>

              <button class="choice-btn">60대</button>

              <button class="choice-btn">50대</button>

              <button class="choice-btn">40대</button>

              <button class="choice-btn">30대</button>

              <button class="choice-btn">20대</button>

              <button class="choice-btn">10대</button>

            </div>

          </div>

          <div class="info-group">

            <label>가장 신뢰하는 가족 관계 <span class="check-badge" id="familyCheck">✓</span></label>

            <div class="choice-wrap" id="familyWrap">

              <button class="choice-btn">배우자</button>

              <button class="choice-btn">딸</button>

              <button class="choice-btn">아들</button>

              <button class="choice-btn">손녀</button>

              <button class="choice-btn">손자</button>

              <button class="choice-btn">형제·자매</button>

              <button class="choice-btn">사위</button>

              <button class="choice-btn">며느리</button>

              <button class="choice-btn">엄마</button>

              <button class="choice-btn">아빠</button>

              <button class="choice-btn">형·오빠</button>

              <button class="choice-btn">누나·언니</button>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

  <div class="character-reveal" id="characterReveal">

    <img id="revealImg" alt="캐릭터" class="single" style="display:none;">

  </div>

  <div class="prev-wrap">
  <button class="prev-btn" onclick="location.href='index2.html'" aria-label="이전">
    <span class="ic">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="#16263F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    이전
  </button>
</div>

  <div class="next-wrap">
  <button id="nextBtn" class="next-btn" aria-label="다음">
    다음
    <span class="ic">
      <svg viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="#16263F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
  </button>
</div>

  <div id="modal" class="modal">

    <div class="modal-box" id="modalBox">

      <p>

        모든 정보를 입력해주세요

      </p>

      <button onclick="closeModal()">

        확인

      </button>

    </div>

  </div>

<script type="module">

  import { setField } from "./session.js";

  window.__setField = setField;

</script>

<script>

  const voiceMap = {

    '1': 'mp3/info_ddoddo.mp3',

    '2': 'mp3/info_bbibbo.mp3',

    '3': 'mp3/info_gamjjock.mp3'

  };

  const voiceIndex = sessionStorage.getItem('voiceIndex') || '1';

  const voiceFile = voiceMap[voiceIndex];

  let currentAudio = null;

  function playAudio(src) {

    if (currentAudio) {

      currentAudio.pause();

      currentAudio.currentTime = 0;

    }

    currentAudio = new Audio(src);

    currentAudio.play().catch(err => {

      console.log('Audio play error:', err);

    });

    return currentAudio;

  }

  function stopAudio() {

    if (currentAudio) {

      currentAudio.pause();

      currentAudio.currentTime = 0;

    }

  }

  function playGuideVoice() {

    playAudio(voiceFile);

  }

  function showCharacterReveal() {
    try {
      const ddoddoRig = document.getElementById('ddoddoRig');
      const revealImg = document.getElementById('revealImg');
      const imgMap = (typeof charImgMap !== 'undefined') ? charImgMap : {};
      if (voiceIndex === '1' && ddoddoRig) {
        ddoddoRig.style.display = 'block';
        if (revealImg) revealImg.style.display = 'none';
        startDdoddoAnim();
      } else if (revealImg && imgMap[voiceIndex]) {
        if (ddoddoRig) ddoddoRig.style.display = 'none';
        revealImg.style.display = 'block';
        revealImg.src = imgMap[voiceIndex];
      }
    } catch (err) {
      console.log('캐릭터 표시 건너뜀:', err);
    }
  }

  function startDdoddoAnim() {
    if (typeof DdoddoAnim !== 'undefined') DdoddoAnim.start();
  }

  function fitScale() {

    const scaleX = window.innerWidth / 2850;

    const scaleY = window.innerHeight / 1575;

    const scale = Math.min(scaleX, scaleY);

    document.getElementById('scaleWrap').style.transform = `translate(-50%, -50%) scale(${scale})`;

  }

  window.addEventListener('resize', fitScale);

  window.addEventListener('load', function() {

    fitScale();

    setTimeout(autoPlayGuideVoice, 300);

    showCharacterReveal();

  });

  function autoPlayGuideVoice() {
    stopAudio();
    currentAudio = new Audio(voiceFile);
    const p = currentAudio.play();
    if (p && p.catch) {
      p.catch(() => {
        const once = () => {
          document.removeEventListener('touchstart', once, true);
          document.removeEventListener('click', once, true);
          if (!currentAudio || currentAudio.paused) playGuideVoice();
        };
        document.addEventListener('touchstart', once, true);
        document.addEventListener('click', once, true);
      });
    }
  }

  fitScale();

    let selectedName = '';

    let selectedGender = '';

    let selectedAge = '';

    let selectedFamily = '';

    const nextBtn =

        document.getElementById('nextBtn');

    function updateReadyState(){

        if(

            selectedName !== '' &&

            selectedGender !== '' &&

            selectedAge !== '' &&

            selectedFamily !== ''

        ){

            nextBtn.classList.add('ready');

        } else {

            nextBtn.classList.remove('ready');

        }

    }

    const nameInput = document.getElementById('nameInput');

    nameInput.addEventListener('input', () => {

        selectedName = nameInput.value.trim();

        document.getElementById('nameCheck').classList.toggle('show', selectedName !== '');

        updateReadyState();

    });

    const genderButtons =

        document.querySelectorAll('#genderWrap .choice-btn');

    genderButtons.forEach(btn => {

        btn.addEventListener('click', () => {

            genderButtons.forEach(b => {

                b.classList.remove('selected');

            });

            btn.classList.add('selected');

            btn.classList.remove('pop');

            void btn.offsetWidth;

            btn.classList.add('pop');

            selectedGender =

                btn.textContent.trim();

            document.getElementById('genderCheck').classList.add('show');

            updateReadyState();

        });

    });

    const ageButtons =

        document.querySelectorAll('#ageWrap .choice-btn');

    ageButtons.forEach(btn => {

        btn.addEventListener('click', () => {

            ageButtons.forEach(b => {

                b.classList.remove('selected');

            });

            btn.classList.add('selected');

            btn.classList.remove('pop');

            void btn.offsetWidth;

            btn.classList.add('pop');

            selectedAge =

                btn.textContent.trim();

            document.getElementById('ageCheck').classList.add('show');

            updateReadyState();

        });

    });

    const familyButtons =

        document.querySelectorAll('#familyWrap .choice-btn');

    familyButtons.forEach(btn => {

        btn.addEventListener('click', () => {

            familyButtons.forEach(b => {

                b.classList.remove('selected');

            });

            btn.classList.add('selected');

            btn.classList.remove('pop');

            void btn.offsetWidth;

            btn.classList.add('pop');

            selectedFamily =

                btn.textContent.trim();

            document.getElementById('familyCheck').classList.add('show');

            updateReadyState();

        });

    });

    nextBtn.addEventListener('click', async () => {

        const name = selectedName;

        const gender = selectedGender;

        const age = selectedAge;

        const family = selectedFamily;

        if(

            name === '' ||

            gender === '' ||

            age === '' ||

            family === ''

        ){

            openModal();

            return;

        }

        localStorage.setItem('userName', name);

        localStorage.setItem('userGender', gender);

        localStorage.setItem('userAge', age);

        localStorage.setItem('userFamily', family);

        if (window.__setField) {

            try {

                await window.__setField('visitorName', name);

                await window.__setField('visitorGender', gender);

                await window.__setField('visitorAge', age);

                await window.__setField('trustedFamilyRelation', family);

            } catch (err) {

                console.log('기본 정보 저장 실패:', err);

            }

        }

        location.href = 'test1.html';

    });

    function openModal(){

        const modal = document.getElementById('modal');

        const modalBox = document.getElementById('modalBox');

        modal.style.display = 'flex';

        modalBox.classList.remove('shake');

        void modalBox.offsetWidth;

        modalBox.classList.add('shake');

    }

    function closeModal(){

        document.getElementById('modal').style.display = 'none';

    }

    </script>

</body>

</html>
