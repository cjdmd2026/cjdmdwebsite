<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf2fa">
  <meta name="robots" content="noindex">
  <title>PC에서 이용해 주세요 | 피싱뚝!</title>
  <link rel="icon" href="img/favicon.ico">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #eaf2fa;
      color: #16263f;
      font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
      text-align: center;
      word-break: keep-all;
    }
    main { width: 100%; max-width: 420px; padding: 40px 24px; background: #fff; border-radius: 24px; }
    .brand { margin: 0 0 28px; color: #c93434; font-size: 20px; font-weight: 800; }
    svg { display: block; width: 72px; height: 72px; margin: 0 auto 24px; color: #526a8a; }
    h1 { margin: 0 0 16px; font-size: clamp(23px, 6vw, 28px); line-height: 1.4; letter-spacing: -.04em; }
    .description { margin: 0; color: #526078; font-size: 16px; line-height: 1.8; }
    a {
      display: block;
      margin-top: 32px;
      padding: 15px 16px;
      border-radius: 12px;
      background: #16263f;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      line-height: 1.5;
    }
    a:hover { background: #2c4261; }
    a:focus-visible { outline: 3px solid #c93434; outline-offset: 4px; }
  </style>
</head>
<body>
  <main aria-labelledby="notice-title">
    <p class="brand">피싱뚝!</p>
    <svg viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="8" y="10" width="56" height="39" rx="5" />
      <path d="M28 61h16M36 49v12M8 40h56" />
    </svg>
    <h1 id="notice-title">PC에서 이용해 주세요</h1>
    <p class="description">피싱뚝! 체험은 PC 전용입니다.<br>휴대폰과 태블릿에서는 이용할 수 없어요.<br>데스크톱이나 노트북으로 접속해 주세요.</p>
    <a href="../project/phishing-ddook/">프로젝트 소개로 돌아가기</a>
  </main>
</body>
</html>
