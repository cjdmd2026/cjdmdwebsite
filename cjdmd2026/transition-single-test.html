<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>하나의 흐름 — 페이지 전환 테스트</title>
  <style>
    * { box-sizing: border-box; }
    :root { font-family: Arial, 'Malgun Gothic', sans-serif; color: #191919; background: #e9e9e6; }
    body { margin: 0; }
    button, select, input { font: inherit; }
    button, select { cursor: pointer; }
    button { color: inherit; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #536dea; outline-offset: 4px; }
    button:disabled, select:disabled { cursor: default; opacity: .4; }
    .workspace { padding: 16px 16px 0; }
    .stage { position: relative; height: calc(100dvh - 172px); min-height: 400px; max-width: 100%; margin: auto; overflow: hidden; isolation: isolate; background: #fff; border-radius: 5px; box-shadow: 0 0 0 1px #0000000d; }
    .stage.is-mobile { width: 390px; }
    .scene { position: absolute; inset: 0; overflow: auto; background: #fbfbf8; }
    .scene[hidden] { display: none; }
    .scene.is-incoming { z-index: 2; }
    .scene.is-current { z-index: 1; }
    .stage.is-transitioning .scene { overflow: hidden; pointer-events: none; }
    .site-header { height: 76px; padding: 0 4%; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #0002; gap: 20px; }
    .logo { font-size: 23px; font-weight: 800; letter-spacing: -1.5px; white-space: nowrap; }
    .site-nav { display: flex; gap: 28px; }
    .site-nav button { border: 0; padding: 9px 0; background: none; font-size: 13px; }
    .site-nav [aria-current="page"] { border-bottom: 1px solid currentColor; font-weight: bold; }
    .page-body { padding: 34px 4% 45px; }
    .eyebrow { margin: 0; font-size: 10px; letter-spacing: 1.7px; }
    .page-title { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 25px 0 30px; }
    h1 { font-size: clamp(48px, 6vw, 92px); font-weight: 500; letter-spacing: -.075em; line-height: 1.1; margin: 0; }
    .page-title p { font-size: 12px; line-height: 1.8; margin: 0; max-width: 280px; word-break: keep-all; }
    .card-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    figure { margin: 0; min-width: 0; }
    .project-image { width: 100%; aspect-ratio: 1.65; object-fit: cover; display: block; background: #e3e3e3; }
    figcaption { padding-top: 13px; display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
    figcaption small { font-size: 10px; opacity: .6; }
    .designer { background: #181a1c; color: #fafaf5; }
    .designer .site-header { border-color: #fff3; }
    .designer .page-title p { color: #b1b4ba; }
    .portrait { width: 100%; aspect-ratio: 1.65; display: block; object-fit: contain; object-position: center top; background: #e6e6e2; }
    .scene-footer { display: flex; justify-content: space-between; margin-top: 35px; padding-top: 16px; border-top: 1px solid #8885; font-size: 10px; letter-spacing: .7px; }
    #swarm { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
    .lab { padding: 19px 24px 16px; max-width: 1600px; margin: auto; }
    .lab-top { display: flex; justify-content: space-between; gap: 20px; align-items: center; }
    .lab-heading { display: flex; gap: 12px; align-items: center; }
    .badge { font-size: 10px; padding: 5px 7px; border: 1px solid #bbb; border-radius: 3px; letter-spacing: 1px; }
    .lab-heading strong { font-size: 14px; }
    .controls { display: flex; align-items: center; gap: 8px; }
    .control { border: 1px solid #c9c9c5; background: transparent; border-radius: 4px; padding: 10px 12px; font-size: 12px; }
    .primary { background: #191919; color: #fff; border-color: #191919; min-width: 126px; }
    .timeline { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
    .timeline input { flex: 1; min-width: 50px; accent-color: #191919; height: 4px; cursor: ew-resize; }
    #progress-value { font: 11px monospace; min-width: 36px; text-align: right; }
    .lab-bottom { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 9px; font-size: 11px; color: #666; }
    .lab-bottom p { margin: 0; }
    .load-option { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
    .stage[data-compact="true"] .site-header { height: 64px; padding-inline: 22px; }
    .stage[data-compact="true"] .logo { font-size: 19px; }
    .stage[data-compact="true"] .site-nav { gap: 16px; }
    .stage[data-compact="true"] .page-body { padding: 28px 22px; }
    .stage[data-compact="true"] .page-title { display: block; margin-top: 24px; }
    .stage[data-compact="true"] h1 { font-size: 52px; }
    .stage[data-compact="true"] .page-title p { margin-top: 16px; }
    .stage[data-compact="true"] .card-grid { grid-template-columns: 1fr; gap: 28px; }
    .stage[data-compact="true"] .eyebrow { font-size: 8px; letter-spacing: .7px; }
    @media (max-width: 740px) {
      .workspace { padding: 8px 8px 0; }
      .stage { height: calc(100dvh - 244px); min-height: 320px; }
      .lab { padding: 16px; }
      .lab-top { display: block; }
      .controls { margin-top: 15px; flex-wrap: wrap; }
      .lab-bottom { align-items: start; font-size: 10px; }
      .lab-bottom p { max-width: 60%; line-height: 1.6; }
      #mobile-toggle { display: none; }
    }
  </style>
</head>
<body>
  <div class="workspace">
    <main class="stage" id="stage" aria-label="페이지 전환 미리보기">
      <section class="scene is-current" id="projects" aria-label="프로젝트 예시 화면">
        <header class="site-header"><span class="logo">유연한 결합</span><nav class="site-nav" aria-label="예시 내비게이션"><button data-page="0" aria-current="page">프로젝트</button><button data-page="1">디자이너</button></nav></header>
        <div class="page-body">
          <p class="eyebrow">2026 CJU DMD · GRADUATION EXHIBITION</p>
          <div class="page-title"><h1>프로젝트</h1><p>서로 다른 생각이 만나<br>새로운 가능성으로 이어집니다.</p></div>
          <div class="card-grid">
            <figure><img class="project-image" src="assets/images/project/test/project_1.png" alt="피싱뚝 프로젝트" decoding="async"><figcaption>피싱뚝! <small>01 / EDUCATION</small></figcaption></figure>
            <figure><img class="project-image" src="assets/images/project/test/project_2.png" alt="아푸치카 프로젝트" decoding="async"><figcaption>아푸치카 <small>02 / EDUCATION</small></figcaption></figure>
            <figure><img class="project-image" src="assets/images/project/test/project_3.png" alt="졸업전시 프로젝트" decoding="async"><figcaption>새로운 연결 <small>03 / EXPERIENCE</small></figcaption></figure>
          </div>
          <div class="scene-footer"><span>서로 다른 우리, 하나의 흐름.</span><span>PROJECTS / 01</span></div>
        </div>
      </section>
      <section class="scene designer" id="designers" aria-label="디자이너 예시 화면" hidden inert>
        <header class="site-header"><span class="logo">유연한 결합</span><nav class="site-nav" aria-label="예시 내비게이션"><button data-page="0">프로젝트</button><button data-page="1" aria-current="page">디자이너</button></nav></header>
        <div class="page-body">
          <p class="eyebrow">2026 CJU DMD · GRADUATION EXHIBITION</p>
          <div class="page-title"><h1>디자이너</h1><p>각자의 색으로 시작해<br>함께 만들어낸 하나의 전시.</p></div>
          <div class="card-grid">
            <figure><img class="portrait" src="assets/images/designer/student/yountaegyun.webp" alt="윤태균" decoding="async"><figcaption>윤태균 <small>DESIGNER / 01</small></figcaption></figure>
            <figure><img class="portrait" src="assets/images/designer/student/ahnnagyeong.webp" alt="안나경" decoding="async"><figcaption>안나경 <small>DESIGNER / 02</small></figcaption></figure>
            <figure><img class="portrait" src="assets/images/designer/student/leenayeong.webp" alt="이나영" decoding="async"><figcaption>이나영 <small>DESIGNER / 03</small></figcaption></figure>
          </div>
          <div class="scene-footer"><span>서로 다른 우리, 하나의 흐름.</span><span>DESIGNERS / 02</span></div>
        </div>
      </section>
      <canvas id="swarm" aria-hidden="true" hidden></canvas>
    </main>
  </div>
  <aside class="lab" aria-label="전환 테스트 조절">
    <div class="lab-top">
      <div class="lab-heading"><span class="badge">TEST 01</span><strong>하나의 무리, 한 번의 전환</strong></div>
      <div class="controls">
        <select id="speed" class="control" aria-label="전환 속도"><option value="1100">기본 · 1.1초</option><option value="2200">느리게 · 2.2초</option><option value="4400">아주 느리게 · 4.4초</option></select>
        <button id="mobile-toggle" class="control" aria-pressed="false">모바일 보기</button>
        <button id="pause" class="control" disabled>일시정지</button>
        <button id="play" class="control primary" disabled>준비 중…</button>
      </div>
    </div>
    <div class="timeline"><input id="progress" type="range" min="0" max="1000" value="0" aria-label="전환 진행 위치" disabled><output id="progress-value" for="progress">0%</output></div>
    <div class="lab-bottom"><p id="status" role="status">아이콘과 예시 화면을 준비하고 있습니다.</p><label class="load-option"><input id="slow-load" type="checkbox">느린 로딩 테스트 (+1.5초)</label></div>
  </aside>
  <noscript>전환 테스트를 보려면 JavaScript를 활성화해 주세요.</noscript>

  <script>
    (() => {
      'use strict';
      // This isolated prototype keeps both sample pages in one document. Production
      // document navigation still needs a persistent shell + destination readiness.
      const $ = id => document.getElementById(id);
      const stage = $('stage'), canvas = $('swarm'), ctx = canvas.getContext('2d');
      const pages = [$('projects'), $('designers')];
      const play = $('play'), pause = $('pause'), slider = $('progress'), speed = $('speed');
      const status = $('status'), reduced = matchMedia('(prefers-reduced-motion: reduce)');
      let sprites = [], particles = [], geometry, current = 0, next = 1;
      let frame = 0, progress = 0, running = false, active = false, preparing = false;
      let start = 0, duration = 1100, lastFrame = 0, intervals = [], ready = false;
      const names = ['프로젝트', '디자이너'];
      const imagesReady = Promise.allSettled([...document.images].map(image => image.decode()));

      async function prepareSprites() {
        // Decode ONE prebuilt image once. Moving pieces are just source rectangles
        // copied from this raster canvas; no SVG nodes are created, even at startup.
        const {source, cell, columns, count} = JSON.parse($('sprite-sheet').textContent);
        const image = new Image();
        image.src = source;
        await image.decode();
        const atlas = document.createElement('canvas');
        atlas.width = image.naturalWidth; atlas.height = image.naturalHeight;
        atlas.getContext('2d').drawImage(image, 0, 0);
        return Array.from({length: count}, (_, index) => ({atlas,
          x: index % columns * cell, y: Math.floor(index / columns) * cell, size: cell}));
      }

      function makeParticles() {
        const compact = geometry.width < 640;
        const bodyCount = compact ? 48 : 80;
        const tailCount = compact ? 34 : 56;
        const count = bodyCount + tailCount;
        particles = Array.from({length: count}, (_, i) => {
          // Keep a clustered head, then gradually open up the spacing behind it.
          // More of the total pieces now belong to the readable trailing plume.
          const trailing = i >= bodyCount;
          const depth = trailing
            ? .075 + Math.pow((i - bodyCount + .5) / tailCount, 1.2) * .925
            : Math.pow((i + .5) / bodyCount, 1.5) * .075;
          const seed = ((i * 9301 + 49297) % 233280) / 233280;
          const band = (((i * 37) % bodyCount + .5) / bodyCount) * 2 - 1;
          const scatter = trailing ? ((i * .754877666) % 1) * 2 - 1
            : Math.sign(band) * Math.pow(Math.abs(band), 1.45);
          return {
            sprite: sprites[i % sprites.length], lane: (i * .61803398875) % 1,
            seed, depth, scatter, trailing,
            scale: trailing ? (.40 + ((i * 11) % 17) / 100) * (1 - depth * .12)
              : .52 + ((i * 17) % 35) / 100,
            opacity: 1 - depth * .18,
            angle: trailing ? ((i * 23) % 24) - 12 : ((i * 23) % 60) - 30,
            offsetY: trailing ? ((i * 43) % 24) - 12 : ((i * 43) % 70) - 35,
            spin: (((i * 31) % 21) - 10) * .096
          };
        });
        // Choose organic vertical positions once, keeping excessive tail overlap
        // low across several points of the motion. This is not a grid or a
        // per-frame collision simulation; a little overlap near the head remains.
        const sampleTimes = [0, 275, 550, 825, 1100];
        const placed = particles.slice(0, bodyCount).map(particle => ({
          scale: particle.scale, weight: .35,
          samples: sampleTimes.map(time => particlePosition(particle, time))
        }));
        for (const particle of particles.slice(bodyCount)) {
          const originalLane = particle.lane;
          let bestLane = originalLane, bestPenalty = Infinity, bestSamples;
          for (let candidate = 0; candidate < 20; candidate++) {
            particle.lane = candidate === 0 ? originalLane
              : .04 + .92 * ((originalLane + candidate * .61803398875) % 1);
            const samples = sampleTimes.map(time => particlePosition(particle, time));
            let penalty = 0;
            for (const other of placed) {
              const spacing = geometry.iconSize * (particle.scale + other.scale) * (.48 + particle.depth * .08);
              for (let index = 0; index < samples.length; index++) {
                const dx = samples[index].x - other.samples[index].x;
                const dy = samples[index].y - other.samples[index].y;
                const overlap = Math.max(0, 1 - (dx * dx + dy * dy) / (spacing * spacing));
                penalty += overlap * overlap * other.weight;
              }
            }
            if (penalty < bestPenalty) {
              bestPenalty = penalty; bestLane = particle.lane; bestSamples = samples;
            }
            if (penalty === 0) break;
          }
          particle.lane = bestLane;
          placed.push({scale: particle.scale, weight: 1, samples: bestSamples});
        }
        canvas.dataset.pieces = String(count);
        canvas.dataset.tailPieces = String(tailCount);
      }

      function resize() {
        const width = stage.clientWidth, height = stage.clientHeight;
        const iconSize = Math.min(156, Math.max(76, width * .1)) * 1.25;
        const spread = Math.min(150, width * .19, iconSize * .88);
        const drift = Math.min(16, iconSize * .1);
        // Shorten the previous plume by one third; add detail through smaller
        // pieces and vertical spacing instead of extending its exit distance.
        const tailLength = Math.min(480, width * .6);
        const margin = width * .109 + spread + drift + iconSize * Math.SQRT1_2 + 16;
        // Extra exit distance lets the last trailing icons leave naturally instead
        // of disappearing when the page boundary has already crossed the screen.
        geometry = {width, height, iconSize, spread, drift, tailLength,
          startMargin: margin, endMargin: margin + tailLength,
          ratio: Math.min(devicePixelRatio || 1, 1.5)};
        canvas.width = Math.ceil(width * geometry.ratio);
        canvas.height = Math.ceil(height * geometry.ratio);
        stage.dataset.compact = String(width < 640);
        // Keep the same particles when resizing midway through a pass.
        if (active) paint(progress);
      }

      function waveX(y, base, time) {
        const {width, height} = geometry;
        return base + Math.sin(y / height * Math.PI * 3.2 + time * .004) * width * .075
          + Math.sin(y / height * Math.PI * 7.4 - time * .006) * width * .034;
      }

      function particlePosition(particle, time) {
        const {height, spread, drift, tailLength} = geometry;
        const depth = particle.depth;
        // Give the fuller tail room vertically and keep its individual shapes
        // steady enough to read as they follow the accelerating head.
        const lane = .5 + (particle.lane - .5) * (1 - depth * .12);
        const flutter = particle.trailing ? .016 : .035;
        const y = lane * height + Math.sin(time * .0018 + particle.seed * 12) * height * flutter + particle.offsetY;
        const x = waveX(y, 0, time) * (1 - depth * .78) - depth * tailLength
          + particle.scatter * spread * (1 - depth * .7)
          + Math.sin(time * .003 + particle.seed * 20) * drift;
        return {x, y};
      }

      function paint(value) {
        progress = value;
        const {width, height, startMargin, endMargin, iconSize, ratio} = geometry;
        // One shared clock drives the page mask and the entire head-to-tail swarm.
        // Changing the duration never changes the path; seeking is deterministic.
        // Ease in only: start gently, then keep accelerating until the tail exits.
        const travel = value * value;
        const time = travel * 1100, base = -startMargin + (width + startMargin + endMargin) * travel;
        const points = Array.from({length: 65}, (_, i) => {
          const y = height * i / 64;
          return {x: waveX(y, base, time), y};
        });
        pages[next].style.clipPath = 'polygon(0 0,' + points.map(p => p.x.toFixed(2) + 'px ' + p.y.toFixed(2) + 'px').join(',') + ',0 100%)';
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        // The outgoing page remains beneath the mask, so no opaque white stripe
        // is needed between the scattered pieces.
        for (const particle of particles) {
          const position = particlePosition(particle, time);
          const x = base + position.x, y = position.y;
          if (x < -iconSize || x > width + iconSize || y < -iconSize || y > height + iconSize) continue;
          const angle = (particle.angle + particle.spin * time / 1000) * Math.PI / 180;
          const scale = particle.scale * ratio, cos = Math.cos(angle) * scale, sin = Math.sin(angle) * scale;
          ctx.setTransform(cos, sin, -sin, cos, x * ratio, y * ratio);
          ctx.globalAlpha = particle.opacity;
          const sprite = particle.sprite;
          ctx.drawImage(sprite.atlas, sprite.x, sprite.y, sprite.size, sprite.size, -iconSize / 2, -iconSize / 2, iconSize, iconSize);
        }
        ctx.globalAlpha = 1;
        slider.value = Math.round(value * 1000);
        $('progress-value').textContent = Math.round(value * 100) + '%';
      }

      function setup(target = 1 - current) {
        next = target; active = true; progress = 0; intervals = [];
        pages[next].hidden = false;
        pages[next].classList.add('is-incoming');
        pages[next].style.clipPath = 'inset(0 100% 0 0)';
        pages[next].scrollTop = 0;
        pages.forEach(page => { page.inert = true; });
        stage.classList.add('is-transitioning');
        canvas.hidden = false;
        makeParticles(); paint(0);
        pause.disabled = false;
        speed.disabled = true;
        $('slow-load').disabled = true;
        play.textContent = '처음부터 ↗';
      }

      function stop() {
        cancelAnimationFrame(frame); frame = 0; running = false; lastFrame = 0;
      }

      function finish() {
        stop();
        const hadSceneFocus = pages.some(page => page.contains(document.activeElement));
        pages[current].hidden = true;
        pages[current].classList.remove('is-current');
        pages[next].style.clipPath = '';
        pages[next].classList.remove('is-incoming');
        pages[next].classList.add('is-current');
        pages[next].inert = false;
        current = next; active = false;
        stage.classList.remove('is-transitioning');
        canvas.hidden = true;
        pause.disabled = true; pause.textContent = '일시정지';
        play.textContent = '전환 재생 →'; speed.disabled = false; $('slow-load').disabled = false;
        slider.value = 1000; $('progress-value').textContent = '100%';
        const slowFrames = intervals.filter(ms => ms > 50).length;
        status.textContent = reduced.matches ? names[current] + ' · 모션 감소 설정에 따라 즉시 전환했습니다.'
          : names[current] + ' · 전환 완료' + (intervals.length ? ' · 50ms 이상 프레임 ' + slowFrames + '회' : '');
        if (hadSceneFocus) play.focus({preventScroll: true});
      }

      function resume() {
        if (reduced.matches || !ctx) { finish(); return; }
        running = true; start = performance.now() - progress * duration; lastFrame = 0;
        pause.textContent = '일시정지';
        status.textContent = names[current] + ' → ' + names[next] + ' · 한 무리가 지나간 자리에서 다음 화면이 드러납니다.';
        function tick(now) {
          if (!running) return;
          if (lastFrame) intervals.push(now - lastFrame);
          lastFrame = now;
          const value = Math.min(1, Math.max(0, (now - start) / duration));
          paint(value);
          if (value === 1) finish(); else frame = requestAnimationFrame(tick);
        }
        frame = requestAnimationFrame(tick);
      }

      async function begin(target = 1 - current) {
        if (!ready || preparing || target === current) return;
        if (active) { stop(); paint(0); intervals = []; resume(); return; }
        preparing = true; play.disabled = true; slider.disabled = true;
        status.textContent = '다음 화면 준비 중… 준비가 끝나면 끊김 없이 출발합니다.';
        await imagesReady;
        if ($('slow-load').checked) await new Promise(resolve => setTimeout(resolve, 1500));
        preparing = false; play.disabled = false; slider.disabled = false;
        duration = Number(speed.value);
        // Asset failures or unavailable Canvas must never leave the preview covered.
        if (reduced.matches || !ctx || !sprites.length) {
          next = target; pages[next].hidden = false; finish(); return;
        }
        setup(target); resume();
      }

      play.addEventListener('click', () => { void begin(); });
      document.querySelectorAll('[data-page]').forEach(button => button.addEventListener('click', () => { void begin(Number(button.dataset.page)); }));
      pause.addEventListener('click', () => {
        if (running) { stop(); pause.textContent = '계속 재생'; status.textContent = '일시정지 · 진행 막대를 움직여 경계와 아이콘을 확인할 수 있습니다.'; }
        else if (active) resume();
      });
      slider.addEventListener('input', () => {
        if (!ready || preparing || !ctx || !sprites.length || reduced.matches) return;
        const value = Number(slider.value) / 1000;
        if (!active) { duration = Number(speed.value); setup(); }
        stop(); paint(value); pause.textContent = '계속 재생';
        status.textContent = '위치 확인 · 아이콘 무리와 화면 경계가 같은 위치로 움직입니다.';
        if (value === 1) finish();
      });
      $('mobile-toggle').addEventListener('click', event => {
        const mobile = stage.classList.toggle('is-mobile');
        event.currentTarget.setAttribute('aria-pressed', String(mobile));
        event.currentTarget.textContent = mobile ? '데스크톱 보기' : '모바일 보기';
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && running) { stop(); pause.textContent = '계속 재생'; status.textContent = '탭을 벗어나 재생을 멈췄습니다. 계속 재생할 수 있습니다.'; }
      });
      reduced.addEventListener('change', () => {
        slider.disabled = reduced.matches || !ready;
        if (reduced.matches && active) finish();
      });
      new ResizeObserver(resize).observe(stage);
      resize();
      Promise.allSettled([prepareSprites(), imagesReady]).then(results => {
        if (results[0].status === 'fulfilled') sprites = results[0].value;
        ready = true; play.disabled = false; slider.disabled = reduced.matches || !ctx || !sprites.length;
        play.textContent = '전환 재생 →';
        status.textContent = sprites.length && ctx ? '전환 재생을 눌러보세요. 진행 막대로 중간 위치도 확인할 수 있습니다.' : '아이콘을 준비하지 못했습니다. 화면은 즉시 전환됩니다.';
      });
    })();
  </script>
</body>
</html>
