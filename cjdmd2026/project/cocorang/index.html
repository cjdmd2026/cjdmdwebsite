        <text x="4.38259" y="23.03125" textLength="1163.2585" lengthAdjust="spacingAndGlyphs">반려견과 함께하는 가구가 늘어나면서 산책은 일상이 되었지만, 동네 반려견과 보호자들이 자연스럽게 교류할 기회는 부족합니다. </text>
        <text x="102.68179" y="52.03131" textLength="960.63648" lengthAdjust="spacingAndGlyphs">기존 서비스는 산책 기록과 장소 정보, 커뮤니티 기능이 분산되어 있어 실제 만남으로 이어지기 어렵습니다. </text>
        <text x="75.04838" y="81.03119" textLength="1015.9031" lengthAdjust="spacingAndGlyphs">이에 반려견의 성향과 교류 의사를 확인하고, 산책을 통해 동네 이웃과 자연스럽게 연결되는 서비스가 필요합니다.</text>
      </svg>
    </p>

        <text x="0" y="30.70312" textLength="706.37875" lengthAdjust="spacingAndGlyphs">스쳐 지나가는 산책을 넘어, 자연스러운 연결이 필요합니다.</text>

    <p class="case-copy" style="left:7.70833%;top:46.2037%;width:46.09375%;height:2.22222222%">

        <text x="0" y="19.10938" textLength="881.92973" lengthAdjust="spacingAndGlyphs">동네 반려견의 성향과 교류 의사를 미리 알아보고, 서로에게 잘 맞는 친구를 편안하게 만날 수 있는 환경이 필요합니다. </text>
        <text x="0" y="43.10938" textLength="766.77965" lengthAdjust="spacingAndGlyphs">이를 통해 일상적인 산책이 새로운 만남의 기회가 되고, 지속적인 이웃 관계로 이어질 수 있어야 합니다.</text>

        <text x="44.25178" y="15.13297" textLength="229.93018" lengthAdjust="spacingAndGlyphs">좋은 만남이 있어도 기록되거나 연결되지 않아</text>

        <text x="47.37504" y="16.03142" textLength="229.87354" lengthAdjust="spacingAndGlyphs">동네 반려인 정보를 확인하고 공통 관심사를</text>

        <text x="2.82816" y="16.00272" textLength="259.56499" lengthAdjust="spacingAndGlyphs">산책 경험을 기록하고 커뮤니티를 통해 관계를 </text>
        <text x="34.46765" y="38.00266" textLength="193.10189" lengthAdjust="spacingAndGlyphs">지속할 수 있는 관리 구조가 필요함</text>

        <text x="47.52403" y="33.53136" textLength="197.93856" lengthAdjust="spacingAndGlyphs">를 형성할 수 있는 연결 구조가 필요함</text>

    </p>
    <p class="case-copy" style="left:24.89583%;top:50.4012%;width:50.10417%;height:2.90872297%">
      <svg class="case-text" role="presentation" viewBox="0 0 962.00006 57.99994" preserveAspectRatio="none" style="font-size:24px;font-weight:400;fill:#ffffff;letter-spacing:-0.48px">
        <text x="6.53549" y="23.03125" textLength="954.95251" lengthAdjust="spacingAndGlyphs">반려견마다 성향과 교류 의사가 다르기에 서로를 미리 이해하는 과정이 중요합니다. 이를 바탕으로 산책 중 </text>
        <text x="56.86886" y="52.03131" textLength="848.26214" lengthAdjust="spacingAndGlyphs">잘 맞는 친구를 만나고, 동네 커뮤니티에서 소통하며 지속적인 관계로 이어갈 수 있어야 합니다.</text>
      </svg>
    </p>
    <p class="case-copy" style="left:29.47917%;top:84.80441%;width:40.98958%;height:3.81143109%">

        <text x="54.38131" y="30.375" textLength="678.2375" lengthAdjust="spacingAndGlyphs">서로를 미리 알아보는 것은 자연스러운 만남의 시작이자, </text>
        <text x="0.08314" y="68.37506" textLength="786.83366" lengthAdjust="spacingAndGlyphs">산책에서 시작된 관계를 동네 커뮤니티로 이어주는 기반이 됩니다.</text>
      </svg>
    </p>
