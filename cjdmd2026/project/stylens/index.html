    <p class="case-copy" style="left:6.15385%;top:4.65223%;width:87.69231%;height:2.21096228%">

        <text x="0" y="12.26562" textLength="338.23826" lengthAdjust="spacingAndGlyphs">스타일렌즈의 서비스 경험을 일상으로 확장하기 위해 촉각 요소와 브랜드 </text>
        <text x="0" y="28.26561" textLength="334.05469" lengthAdjust="spacingAndGlyphs">아이덴티티를 반영한 굿즈를 제작하였다. 점자 포토카드, 키링, 파우치 등</text>

        <text x="0" y="28.26561" textLength="333.96094" lengthAdjust="spacingAndGlyphs">서비스 소개와 디지털 옷장 기능을 통해 의류 정보를 공유하고, 스타일을 </text>
