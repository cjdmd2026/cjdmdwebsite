      <svg class="case-text" role="presentation" viewBox="0 0 39.99994 38.00006" preserveAspectRatio="none" style="font-size:32.00006px;font-weight:600;fill:#444444;letter-spacing:-0.63994px">
        <text x="0" y="30.375" textLength="39.07872" lengthAdjust="spacingAndGlyphs">02</text>
      </svg>
    </p>
    <h2 class="case-copy" style="left:10.52083%;top:2.77778%;width:5%;height:1.52777778%">
      <svg class="case-text" role="presentation" viewBox="0 0 96 33" preserveAspectRatio="none" style="font-size:27.99994px;font-weight:400;fill:#444444;letter-spacing:-0.56006px">
        <text x="0" y="26.45312" textLength="95.1168" lengthAdjust="spacingAndGlyphs">상황분석</text>
      </svg>
    </h2>
    <p class="case-copy" style="left:17.82352%;top:10.55818%;width:63.07292%;height:5.41666667%">
      <svg class="case-text" role="presentation" viewBox="0 0 1211.00006 117" preserveAspectRatio="none" style="font-size:32.00006px;font-weight:400;fill:#2a2a2a;letter-spacing:-0.63994px">
        <text x="71.76614" y="30.875" textLength="1067.46758" lengthAdjust="spacingAndGlyphs">우리성은 개인이 다른 사람과의 관계 속에서 자신을 하나의 ‘우리’로 인식하는 감각입니다.</text>
        <text x="330.04742" y="69.875" textLength="550.90502" lengthAdjust="spacingAndGlyphs">이러한 감각은 세계 여러 문화에서 나타나지만</text>
        <text x="23.00755" y="108.875" textLength="1164.98496" lengthAdjust="spacingAndGlyphs"><tspan style="font-size:32.00006px;font-weight:700;fill:#2a2a2a;letter-spacing:-0.63994px">한국에서는 정서적 친밀감과 상호지지, 상호의존을 바탕으로  관계를 형성</tspan>한다는 특징을 보입니다.</text>
      </svg>
    </p>
    <p class="case-copy" style="left:7.70833%;top:43.14815%;width:27.96875%;height:1.75926222%">
      <svg class="case-text" role="presentation" viewBox="0 0 537 38.00006" preserveAspectRatio="none" style="font-size:32.00006px;font-weight:600;fill:#2a2a2a;letter-spacing:-0.63994px">
        <text x="0" y="30.375" textLength="536.35872" lengthAdjust="spacingAndGlyphs">같은 ‘우리’라도 관계를 맺는 방식은 다릅니다</text>
      </svg>
    </p>
    <p class="case-copy" style="left:7.70833%;top:46.2037%;width:50.12166%;height:2.22222222%">
      <svg class="case-text" role="presentation" viewBox="0 0 962.33587 48" preserveAspectRatio="none" style="font-size:20.00006px;font-weight:400;fill:#2a2a2a;letter-spacing:-0.39994px">
        <text x="0" y="19.10938" textLength="965.7984" lengthAdjust="spacingAndGlyphs">보편적인 WE-NESS가 공동의 소속감과 정체성을 의미한다면, 한국적 우리성은 서로의 감정과 경험을 나누며 관계를 만들어가는 </text>
        <text x="0" y="43.10938" textLength="871.42099" lengthAdjust="spacingAndGlyphs">과정에 더욱 주목합니다. 우리성의 존재 자체가 아닌 ‘우리’가 형성되고 유지되는 방식에서 한국적 특성이 나타납니다.</text>
      </svg>
    </p>
    <p class="case-copy" style="left:30.3894%;top:57.97074%;width:5.30228%;height:2.45902222%">
      <svg class="case-text" role="presentation" viewBox="0 0 101.80378 53.11488" preserveAspectRatio="none" style="font-size:20.00006px;font-weight:500;fill:#9daac4;letter-spacing:0px">
        <text x="39.61286" y="19.10938" textLength="22.57805" lengthAdjust="spacingAndGlyphs"><tspan style="font-size:20.00006px;font-weight:700;fill:#9daac4;letter-spacing:0px">01</tspan></text>
        <text x="5.24755" y="43.10938" textLength="91.30867" lengthAdjust="spacingAndGlyphs">관계 중심성</text>
      </svg>
    </p>
    <p class="case-copy" style="left:45.85042%;top:57.97074%;width:8.29921%;height:2.45902222%">
      <svg class="case-text" role="presentation" viewBox="0 0 159.34483 53.11488" preserveAspectRatio="none" style="font-size:20.00006px;font-weight:500;fill:#9daac4;letter-spacing:0px">
        <text x="65.11181" y="19.10938" textLength="29.12102" lengthAdjust="spacingAndGlyphs">02 </text>
        <text x="8.0905" y="43.10938" textLength="143.16403" lengthAdjust="spacingAndGlyphs">심리적 상호의존성</text>
      </svg>
    </p>
    <p class="case-copy" style="left:63.84725%;top:57.97074%;width:6.28204%;height:2.45902222%">
      <svg class="case-text" role="presentation" viewBox="0 0 120.61517 53.11488" preserveAspectRatio="none" style="font-size:20.00006px;font-weight:500;fill:#9daac4;letter-spacing:0px">
        <text x="45.45408" y="19.10938" textLength="29.70701" lengthAdjust="spacingAndGlyphs">03 </text>
        <text x="6.01075" y="43.10938" textLength="108.59366" lengthAdjust="spacingAndGlyphs">당사자적 관여</text>
      </svg>
    </p>
    <p class="case-copy" style="left:28.04323%;top:61.09104%;width:9.45188%;height:2.92009778%">
      <svg class="case-text" role="presentation" viewBox="0 0 181.4761 63.07411" preserveAspectRatio="none" style="font-size:15.99994px;font-weight:200;fill:#000000;letter-spacing:0px">
        <text x="17.87866" y="15.1875" textLength="145.71878" lengthAdjust="spacingAndGlyphs">공통된 목표나 특성보다</text>
        <text x="29.84736" y="34.18744" textLength="121.78118" lengthAdjust="spacingAndGlyphs">사람 사이에 형성된 </text>
        <text x="9.10522" y="53.18756" textLength="163.26566" lengthAdjust="spacingAndGlyphs">관계 자체를 중요하게 인식</text>
      </svg>
    </p>
    <p class="case-copy" style="left:45.33286%;top:61.78548%;width:10.25875%;height:2.92009778%">
      <svg class="case-text" role="presentation" viewBox="0 0 196.968 63.07411" preserveAspectRatio="none" style="font-size:15.99994px;font-weight:200;fill:#000000;letter-spacing:0px">
        <text x="14.99174" y="15.1875" textLength="166.98432" lengthAdjust="spacingAndGlyphs">나와 상대를 완전히 분리된 </text>
        <text x="14.99174" y="34.18744" textLength="166.98432" lengthAdjust="spacingAndGlyphs">개인이 아닌 서로 연결되고 </text>
        <text x="9.93715" y="53.18756" textLength="177.0937" lengthAdjust="spacingAndGlyphs">영향을 주고받는 존재로 인식</text>
      </svg>
    </p>
    <p class="case-copy" style="left:61.18315%;top:61.85664%;width:12.39119%;height:2.92009778%">
      <svg class="case-text" role="presentation" viewBox="0 0 237.91085 63.07411" preserveAspectRatio="none" style="font-size:15.99994px;font-weight:200;fill:#000000;letter-spacing:0px">
        <text x="51.15072" y="15.1875" textLength="135.60941" lengthAdjust="spacingAndGlyphs">상대의 감정과 문제를 </text>
        <text x="53.26003" y="34.18744" textLength="131.39059" lengthAdjust="spacingAndGlyphs">제3자의 일이 아니라 </text>
        <text x="11.93971" y="53.18756" textLength="214.03123" lengthAdjust="spacingAndGlyphs">‘우리의 일’로 받아들이고 함께 관여</text>
      </svg>
    </p>
    <p class="case-copy" style="left:44.25289%;top:87.68754%;width:10.83333%;height:2.03704%">
      <svg class="case-text" role="presentation" viewBox="0 0 207.99994 44.00006" preserveAspectRatio="none" style="font-size:36px;font-weight:700;fill:#7791c5;letter-spacing:0px;font-family:&quot;Inter&quot;,ExhibitionText,sans-serif">
        <text x="0" y="35.09091" textLength="207.03514" lengthAdjust="spacingAndGlyphs">한국적 우리성</text>
      </svg>
    </p>
    <p class="case-copy" style="left:30.17497%;top:91.02087%;width:38.80208%;height:1.75926222%">
      <svg class="case-text" role="presentation" viewBox="0 0 744.99994 38.00006" preserveAspectRatio="none" style="font-size:32.00006px;font-weight:600;fill:#2a2a2a;letter-spacing:-0.63994px">
        <text x="0.10752" y="30.375" textLength="744.7849" lengthAdjust="spacingAndGlyphs">한국적 우리성은 함께 경험하고 반응하는 과정에서 드러납니다</text>
      </svg>
    </p>
    <p class="case-copy" style="left:26.58122%;top:93.42828%;width:45.9375%;height:4.02777778%">
      <svg class="case-text" role="presentation" viewBox="0 0 882 87" preserveAspectRatio="none" style="font-size:24px;font-weight:400;fill:#2a2a2a;letter-spacing:-0.48px">
        <text x="32.27904" y="23.03125" textLength="817.44192" lengthAdjust="spacingAndGlyphs">함께 즐기고, 서로의 행동에 반응하며, 감정과 경험을 나누는 순간 사람들은 하나의 ‘우리’를 </text>
        <text x="9.59155" y="52.03131" textLength="862.8169" lengthAdjust="spacingAndGlyphs">형성합니다. 본 프로젝트는 이러한 관계의 감각이 시대에 따라 어떤 문화적 모습으로 나타났는지 </text>
        <text x="146.98022" y="81.03119" textLength="588.03936" lengthAdjust="spacingAndGlyphs">살펴보기 위해 과거의 생활문화와 오늘날의 K-컬처에 주목합니다.</text>
      </svg>
    </p>

    <p class="case-copy" style="left:32.25221%;top:8.7406%;width:35.3125%;height:2.17929985%">
      <svg class="case-text" role="presentation" viewBox="0 0 678 44.00006" preserveAspectRatio="none" style="font-size:32.00006px;font-weight:600;fill:#000000;letter-spacing:-0.63994px">
        <text x="0.27187" y="33.375" textLength="677.45626" lengthAdjust="spacingAndGlyphs"><tspan style="font-size:32.00006px;font-weight:200;fill:#000000;letter-spacing:-0.63994px">시대는 달라도, </tspan>함께 문화를 만드는 방식은 닮아 있습니다</text>

    </p>
    <p class="case-copy" style="left:24.85638%;top:52.91566%;width:50.10417%;height:4.30906389%">
      <svg class="case-text" role="presentation" viewBox="0 0 962.00006 87" preserveAspectRatio="none" style="font-size:24px;font-weight:400;fill:#2a2a2a;letter-spacing:-0.48px">
        <text x="8.45741" y="23.03125" textLength="951.10867" lengthAdjust="spacingAndGlyphs">김홍도의 풍속화와 오늘날의 K-컬처는 시대와 표현 방식은 다르지만, 문화를 함께 만들고 즐기는 방식에서 </text>
        <text x="18.10195" y="52.03131" textLength="925.79635" lengthAdjust="spacingAndGlyphs">닮아 있습니다. 춤과 음악에 함께 반응하고, 하나의 장면에 몰입하며, 경험을 다른 사람과 나누는 모습은 </text>
        <text x="161.97773" y="81.03119" textLength="638.04461" lengthAdjust="spacingAndGlyphs">개인의 감상을 넘어 관계 속에서 문화를 완성하는 우리성을 보여줍니다.</text>
      </svg>

    <p class="case-copy" style="left:9.33554%;top:83.77774%;width:81.19792%;height:3.76423655%">

        <text x="250.60243" y="30.375" textLength="1057.79501" lengthAdjust="spacingAndGlyphs">우리성은 같은 모습으로 남아 있는 것이 아닌 사람들이 관계를 맺는 방식으로 이어집니다.</text>
        <text x="0.12614" y="68.37506" textLength="1558.74758" lengthAdjust="spacingAndGlyphs"><tspan style="font-size:32.00006px;font-weight:300;fill:#2a2a2a;letter-spacing:-0.63994px">과거와 현재를 ‘우리성’으로 이어보면 K-컬처는 새로운 유행을 넘어 오랫동안 변주되어 온 한국 문화의 흐름으로 보이기 시작합니다.</tspan></text>
      </svg>
    </p>

    <p class="case-copy" style="left:24.20695%;top:14.17698%;width:52.08333%;height:8.31098767%">
      <svg class="case-text" role="presentation" viewBox="0 0 999.99994 123.99994" preserveAspectRatio="none" style="font-size:32.00006px;font-weight:600;fill:#597796;letter-spacing:-0.63994px">
        <text x="221.15174" y="31.66406" textLength="557.69645" lengthAdjust="spacingAndGlyphs"><tspan style="font-size:30px;font-weight:600;fill:#597796;letter-spacing:-0.6px">K-컬처에 대한 관심을 계기로 한국을 방문했지만, </tspan></text>
        <text x="143.71546" y="73.66402" textLength="712.56922" lengthAdjust="spacingAndGlyphs"><tspan style="font-size:30px;font-weight:300;fill:#597796;letter-spacing:-0.6px">한국의 전통문화와 현대문화 사이의 연결은 아직 발견하지 못한</tspan> </text>
        <text x="190.7136" y="115.66414" textLength="618.57274" lengthAdjust="spacingAndGlyphs"><tspan style="font-size:36px;font-weight:600;fill:#ffffff;letter-spacing:-0.72px">외국인 관광객</tspan><tspan style="font-size:36px;font-weight:600;fill:#597796;letter-spacing:-0.72px">을</tspan><tspan style="font-size:36px;font-weight:600;fill:#ffffff;letter-spacing:-0.72px"> </tspan><tspan style="font-size:36px;font-weight:600;fill:#597796;letter-spacing:-0.72px">주요 대상으로 설정했습니다.</tspan></text>
      </svg>
    </p>

        <text x="0" y="19.10938" textLength="684.03283" lengthAdjust="spacingAndGlyphs">인터랙션에서 발견한 ‘우리성’을 김홍도 풍속화 엽서에 담았습니다. 장면별 우리성과 현대의 </text>
        <text x="0" y="43.10938" textLength="622.11725" lengthAdjust="spacingAndGlyphs">우리성을 담은 QR을 통해 전시 이후에도 문화의 흐름을 이어서 경험할 수 있습니다.</text>

        <text x="0" y="43.10938" textLength="680.7024" lengthAdjust="spacingAndGlyphs">시대별 매체의 조작 방식을 인터랙션으로 구현하여, 매체의 변화 속에서도 이어지는 관계와 </text>
        <text x="0" y="67.10938" textLength="216.93907" lengthAdjust="spacingAndGlyphs">함께함의 가치를 전달합니다.</text>

        <text x="0" y="19.10938" textLength="634.70554" lengthAdjust="spacingAndGlyphs">관람객은 제스처로 화면 속 인물들을 서로 이어주고, 그들이 나누는 대화를 듣습니다. </text>
        <text x="0" y="43.10938" textLength="613.66099" lengthAdjust="spacingAndGlyphs">대화에 담긴 관계와 감정 속에서 ‘우리성’을 발견하면, 그 연결은 무동·씨름·주막 등 </text>
