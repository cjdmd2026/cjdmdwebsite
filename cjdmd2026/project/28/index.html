    <p class="case-copy" style="left:21.09375%;top:11.2963%;width:57.70833%;height:4.02777778%">
      <svg class="case-text" role="presentation" viewBox="0 0 1107.99994 87" preserveAspectRatio="none" style="font-size:24px;font-weight:400;fill:#ffffff;letter-spacing:-0.48px">
        <text x="132.67584" y="23.03125" textLength="842.64845" lengthAdjust="spacingAndGlyphs">아침에 오늘의 운세를 읽거나 친구와 서로의 운세를 나누는 등, 운세는 일상에서 가볍게 즐기는</text>
        <text x="152.98483" y="52.03131" textLength="802.03027" lengthAdjust="spacingAndGlyphs">콘텐츠로 자리 잡았습니다. 그중 별자리 운세는 자신의 별자리만 알면 바로 확인할 수 있어</text>
        <text x="254.77632" y="81.03119" textLength="598.44749" lengthAdjust="spacingAndGlyphs">포털과 SNS, 모바일 앱 등 다양한 채널에서 쉽게 접할 수 있습니다.</text>
      </svg>
    </p>
    <p class="case-copy" style="left:7.70833%;top:43.14815%;width:38.17708%;height:1.75926222%">
      <svg class="case-text" role="presentation" viewBox="0 0 732.99994 38.00006" preserveAspectRatio="none" style="font-size:32.00006px;font-weight:600;fill:#ffffff;letter-spacing:-0.63994px">
        <text x="0" y="30.375" textLength="732.80122" lengthAdjust="spacingAndGlyphs">별자리 운세는 가볍게 읽고 함께 나누는 일상의 즐거움입니다.</text>
      </svg>
    </p>
    <p class="case-copy" style="left:7.70833%;top:46.2037%;width:45.20833%;height:2.22222222%">
      <svg class="case-text" role="presentation" viewBox="0 0 867.99994 48" preserveAspectRatio="none" style="font-size:20.00006px;font-weight:400;fill:#ffffff;letter-spacing:-0.39994px">
        <text x="0" y="19.10938" textLength="805.16947" lengthAdjust="spacingAndGlyphs">자신의 별자리만 알면 짧은 시간 안에 오늘의 운세를 확인하고, 친구와 서로의 운세를 비교해 볼 수 있습니다.</text>
        <text x="0" y="43.10938" textLength="769.68902" lengthAdjust="spacingAndGlyphs">이러한 이용 방식에 주목해 기존 서비스가 별자리 운세를 어떤 형식과 주기로 제공하는지 살펴봤습니다.</text>
      </svg>
    </p>
    <p class="case-copy" style="left:26.61458%;top:84.90379%;width:46.77083%;height:1.75926222%">
      <svg class="case-text" role="presentation" viewBox="0 0 897.99994 38.00006" preserveAspectRatio="none" style="font-size:32.00006px;font-weight:600;fill:#ffffff;letter-spacing:-0.63994px">
        <text x="0.47942" y="30.375" textLength="897.04128" lengthAdjust="spacingAndGlyphs">‘별자리 운세’는 많이 제공되지만, 주요 콘텐츠로 다뤄지는 경우는 드물었다.</text>
      </svg>
    </p>
    <p class="case-copy" style="left:21.51042%;top:87.95935%;width:57.03125%;height:2.68518222%">
      <svg class="case-text" role="presentation" viewBox="0 0 1095 57.99994" preserveAspectRatio="none" style="font-size:24px;font-weight:400;fill:#ffffff;letter-spacing:-0.48px">
        <text x="29.45261" y="23.03125" textLength="1036.09498" lengthAdjust="spacingAndGlyphs">기존 운세 앱은 다양한 콘텐츠를 제공하지만 이용 과정이 복잡하고, 웹사이트는 접근이 간편한 대신 콘텐츠의 깊이와</text>
        <text x="9.20198" y="52.03131" textLength="1076.59603" lengthAdjust="spacingAndGlyphs">개인화가 부족합니다. 또한 독립적인 서비스보다 보조 콘텐츠로 제공되는 경우가 많아 지속적인 이용에 한계가 있습니다.</text>
      </svg>
    </p>
