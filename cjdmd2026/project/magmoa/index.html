    <p class="case-copy" style="left:21.71875%;top:8.56481%;width:56.40625%;height:4.58333333%">
      <svg class="case-text" role="presentation" viewBox="0 0 1083 99" preserveAspectRatio="none" style="font-size:24px;font-weight:400;fill:#2a2a2a;letter-spacing:-0.48px">
        <text x="112.98048" y="25.284" textLength="857.03904" lengthAdjust="spacingAndGlyphs">여행 기념품은 방문한 장소와 그곳에서의 경험을 일상 속에서 다시 떠올리게 하는 매개체입니다.</text>
        <text x="46.59187" y="58.284" textLength="989.81626" lengthAdjust="spacingAndGlyphs">하지만 실물 기념품은 판매처가 한정적이고 휴대와 보관에 제약이 있어, 여행지마다 꾸준히 모으기 어렵습니다.</text>
        <text x="0.54739" y="91.284" textLength="1081.90502" lengthAdjust="spacingAndGlyphs">따라서 여행지에서 기념품을 발견하고 수집하는 즐거움을 살리면서, 그날의 기억도 함께 남길 수 있는 방식이 필요합니다.</text>
      </svg>
    </p>
    <p class="case-copy" style="left:7.70833%;top:43.14815%;width:33.28125%;height:1.75926222%">

        <text x="0" y="30.712" textLength="638.00122" lengthAdjust="spacingAndGlyphs">여행 기념품을 모으는 즐거움을 디지털로 이어갑니다.</text>
      </svg>
    </p>
    <p class="case-copy" style="left:7.70833%;top:46.2037%;width:45.20833%;height:2.22222222%">
      <svg class="case-text" role="presentation" viewBox="0 0 867.99994 48" preserveAspectRatio="none" style="font-size:20.00006px;font-weight:400;fill:#2a2a2a;letter-spacing:-0.39994px">
        <text x="0" y="19.32" textLength="615.95386" lengthAdjust="spacingAndGlyphs">마그모아는 여행지에서 기념품을 발견하고 모으는 즐거움을 디지털로 옮겼습니다. </text>
        <text x="0" y="43.32" textLength="740.42112" lengthAdjust="spacingAndGlyphs">지역의 이야기를 담은 마그넷을 수집하고, 그날의 사진과 메모를 함께 남길 수 있도록 기획했습니다.</text>
      </svg>
    </p>

        <text x="35.88326" y="23.03125" textLength="810.23347" lengthAdjust="spacingAndGlyphs">설문 응답자의 76.6%가 기존 기념품을 이용하는 과정에서 불편을 경험했다고 답했습니다.</text>
        <text x="22.41235" y="52.03131" textLength="837.1753" lengthAdjust="spacingAndGlyphs">구매 단계에서는 한정된 판매처가, 구매 이후에는 훼손과 보관 공간이 제약으로 나타났습니다.</text>

      <svg class="case-text" role="presentation" viewBox="0 0 1248.99994 87.99994" preserveAspectRatio="none" style="font-size:32.00006px;font-weight:600;fill:#000000;letter-spacing:-0.63994px">
        <text x="176.94125" y="33.712" textLength="895.11744" lengthAdjust="spacingAndGlyphs">기념품을 모으는 즐거움은 여행지에서 직접 발견하는 순간부터 시작됩니다.</text>
        <text x="0.13056" y="77.71207" textLength="1248.73882" lengthAdjust="spacingAndGlyphs">이 경험을 디지털 마그넷 수집으로 이어가면, 보관 부담을 줄이면서 그날의 기억도 함께 남길 수 있습니다.</text>

        <text x="159.31142" y="24.784" textLength="643.37722" lengthAdjust="spacingAndGlyphs">여행지에서만 얻을 수 있는 마그넷은 그 장소를 찾아가는 이유가 됩니다.</text>
        <text x="13.72512" y="56.78406" textLength="934.54963" lengthAdjust="spacingAndGlyphs">수집한 마그넷에 사진과 메모를 더하면, 여행이 끝난 뒤에도 그곳에서의 경험을 다시 떠올릴 수 있습니다.</text>
      </svg>
    </p>
    <p class="case-copy" style="left:28.22917%;top:84.84696%;width:43.48958%;height:3.8133435%">

        <text x="122.0231" y="30.712" textLength="590.95373" lengthAdjust="spacingAndGlyphs">직접 찾아간 장소가 나만의 여행 컬렉션이 됩니다.</text>
        <text x="0.45005" y="68.71207" textLength="834.10003" lengthAdjust="spacingAndGlyphs">마그모아는 여행지에서의 발견을 디지털 마그넷 수집으로 연결합니다.</text>

        <text x="136.8887" y="32.712" textLength="726.22253" lengthAdjust="spacingAndGlyphs">마그모아의 핵심 타겟은 여행지에서 새로운 장소를 발견하고,</text>
        <text x="71.2537" y="74.712" textLength="857.49254" lengthAdjust="spacingAndGlyphs">방문한 곳의 추억을 기념품으로 간직하고 싶은 20~30대 여행자입니다.</text>

        <text x="0.05491" y="30.712" textLength="575.88998" lengthAdjust="spacingAndGlyphs">여행지의 이야기가 담긴 기념품을 모으는 여행자</text>
      </svg>
    </p>
    <p class="case-copy" style="left:24.375%;top:42.32059%;width:51.19792%;height:3.89000241%">
      <svg class="case-text" role="presentation" viewBox="0 0 983.00006 57.99994" preserveAspectRatio="none" style="font-size:24px;font-weight:400;fill:#ffffff;letter-spacing:-0.48px">
        <text x="1.20288" y="23.284" textLength="980.59411" lengthAdjust="spacingAndGlyphs">여행 중에는 사진으로 순간을 기록하고, 기억에 남는 장소에서는 그 지역을 떠올릴 수 있는 기념품을 찾습니다.</text>

        <text x="0" y="12.392" textLength="338.13281" lengthAdjust="spacingAndGlyphs">관광 명소의 풍경과 이야기를 마그넷과 스티커 등으로 풀어낸 여행 굿즈이</text>
