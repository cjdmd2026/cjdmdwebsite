        <text x="136.05965" y="24.53125" textLength="946.88064" lengthAdjust="spacingAndGlyphs">조용함, 전통성, 거리감으로 인식되던 불교는 최근 젊은 세대에게 감각적인 문화 콘텐츠로 다시 읽히고 있다.</text>
        <text x="272.25542" y="56.53131" textLength="674.48909" lengthAdjust="spacingAndGlyphs">한국을 비롯한 해외에서는 불교를 다르게 받아들이는 수요가 감지되고 있다. </text>
        <text x="8.37504" y="88.53119" textLength="1202.25005" lengthAdjust="spacingAndGlyphs">특히 한국에서 불교박람회, 굿즈, 밈, 사찰음식, EDM은 불교가 종교를 넘어 감각적 라이프스타일 콘텐츠로 재해석되고 있음을 보여준다.</text>

        <text x="4.92845" y="61.74225" textLength="1118.1431" lengthAdjust="spacingAndGlyphs"><tspan style="font-size:26.00006px;font-weight:400;fill:#ffffff;letter-spacing:-0.7801px">이들은 정해진 방식으로 문화를 배우기보다, 자신이 직접 선택하고 참여할 수 있는 </tspan><tspan style="font-size:26.00006px;font-weight:400;fill:#c92b2b;letter-spacing:-0.7801px">감각적 경험</tspan><tspan style="font-size:26.00006px;font-weight:400;fill:#ffffff;letter-spacing:-0.7801px">에 더 빠르게 반응한다.</tspan></text>
      </svg>
    </p>

        <text x="101.54496" y="30.375" textLength="685.91002" lengthAdjust="spacingAndGlyphs">음악의 확산성과 변화하는 불교의 접근 방식이 만난다면, </text>
        <text x="0.12806" y="68.37506" textLength="888.74381" lengthAdjust="spacingAndGlyphs">불교는 더 감각적이고 <tspan style="font-size:32.00006px;font-weight:600;fill:#c92b2b;letter-spacing:-0.63994px">참여 가능한 지속가능 문화 경험</tspan>으로 확장될 수 있다.</text>

    <p class="case-copy" style="left:19.89583%;top:64.87696%;width:58.07292%;height:10.73825503%">
      <svg class="case-text" role="presentation" viewBox="0 0 1115.00006 96" preserveAspectRatio="none" style="font-size:24px;font-weight:400;fill:#ffffff;letter-spacing:-0.72px">
        <text x="46.8887" y="24.53125" textLength="1021.22246" lengthAdjust="spacingAndGlyphs">OMIX는 불교의 울림 ‘OM’을 음악(MUSIC)과 참여(INTERACTION)를 통해 새로운 문화 경험(EXPERIENCE)으로</text>
        <text x="120.81619" y="56.53131" textLength="873.36749" lengthAdjust="spacingAndGlyphs">확장하는 K-Buddhism 플랫폼이다. 전통 불교의 가치와 상징을 동시대의 음악적 언어로 재해석해, </text>
        <text x="207.58099" y="88.53119" textLength="699.83808" lengthAdjust="spacingAndGlyphs">젊은 세대가 보다 직관적으로 경험하고 공유할 수 있는 새로운 접점을 제안한다.</text>
      </svg>
    </p>

    </p>

      <svg class="case-text" role="presentation" viewBox="0 0 41.00006 36" preserveAspectRatio="none" style="font-size:32.00006px;font-weight:600;fill:#aaaaaa;letter-spacing:-0.63994px">

    <h2 class="case-copy" style="left:10.57292%;top:0.86643%;width:3.95833%;height:0.44765251%">
      <svg class="case-text" role="presentation" viewBox="0 0 75.99994 30.99994" preserveAspectRatio="none" style="font-size:27.99994px;font-weight:400;fill:#aaaaaa;letter-spacing:-0.56006px">
        <text x="0" y="25.45319" textLength="71.47757" lengthAdjust="spacingAndGlyphs">디자인</text>
      </svg>
    </h2>
    <h3 class="case-copy" style="left:7.70833%;top:16.57762%;width:11.30208%;height:0.54873739%">
      <svg class="case-text" role="presentation" viewBox="0 0 216.99994 38.00006" preserveAspectRatio="none" style="font-size:32.00006px;font-weight:600;fill:#ffffff;letter-spacing:-0.63994px">
        <text x="0" y="30.375" textLength="216.76992" lengthAdjust="spacingAndGlyphs">서비스경험디자인</text>
      </svg>
    </h3>
    <p class="case-copy" style="left:7.70833%;top:17.47292%;width:39.32292%;height:1.38628159%">
      <svg class="case-text" role="presentation" viewBox="0 0 755.00006 96" preserveAspectRatio="none" style="font-size:20.00006px;font-weight:400;fill:#ffffff;letter-spacing:-0.39994px">
        <text x="0" y="19.10938" textLength="752.78438" lengthAdjust="spacingAndGlyphs">불교와 음악을 결합한 전시 경험을 굿즈와 오프라인 공간으로 확장한 서비스 디자인 프로젝트이다. 관</text>
        <text x="0" y="43.10938" textLength="746.40864" lengthAdjust="spacingAndGlyphs">람객은 OMIX의 상징과 그래픽을 담은 의류, 키링, 스티커 등 다양한 굿즈를 직접 만나고 선택하며 브</text>
        <text x="0" y="67.10938" textLength="752.9015" lengthAdjust="spacingAndGlyphs">랜드를 경험한다. 전시에서 느낀 감각을 실물로 소장하고 일상에서 사용함으로써, 일회성 체험이 지속</text>
        <text x="0" y="91.10938" textLength="276.83366" lengthAdjust="spacingAndGlyphs">적인 문화 경험으로 이어지도록 한다.</text>
      </svg>
    </p>
    <h3 class="case-copy" style="left:7.70833%;top:35.35018%;width:11.30208%;height:0.54873739%">
      <svg class="case-text" role="presentation" viewBox="0 0 216.99994 38.00006" preserveAspectRatio="none" style="font-size:32.00006px;font-weight:600;fill:#ffffff;letter-spacing:-0.63994px">
        <text x="0" y="30.375" textLength="216.76992" lengthAdjust="spacingAndGlyphs">인터페이스디자인</text>
      </svg>
    </h3>
    <p class="case-copy" style="left:7.70833%;top:36.24549%;width:39.63542%;height:1.03971119%">
      <svg class="case-text" role="presentation" viewBox="0 0 761.00006 72" preserveAspectRatio="none" style="font-size:20.00006px;font-weight:400;fill:#ffffff;letter-spacing:-0.39994px">
        <text x="0" y="19.10938" textLength="753.97651" lengthAdjust="spacingAndGlyphs">OMIX는 한국 불교의 소리와 상징, 의례의 분위기를 현대 음악으로 재해석하는 플랫폼이다. 차트와 장</text>
        <text x="0" y="43.10938" textLength="759.22272" lengthAdjust="spacingAndGlyphs">르 탐색으로 듣고(Listen), 인터랙티브 체험으로 나만의 사운드를 만들고(Mix), 그 결과를 아카이브에 </text>
        <text x="0" y="67.10938" textLength="670.41101" lengthAdjust="spacingAndGlyphs">저장해 언제든 다시 꺼내 듣는다(Return). 불교를 설명하지 않고 먼저 듣고 경험하게 한다.</text>
      </svg>
    </p>
    <h3 class="case-copy" style="left:7.70833%;top:54.70036%;width:9.89583%;height:0.54873739%">
      <svg class="case-text" role="presentation" viewBox="0 0 189.99994 38.00006" preserveAspectRatio="none" style="font-size:32.00006px;font-weight:600;fill:#ffffff;letter-spacing:-0.63994px">
        <text x="0" y="30.375" textLength="189.75379" lengthAdjust="spacingAndGlyphs">인터랙션디자인</text>
      </svg>
