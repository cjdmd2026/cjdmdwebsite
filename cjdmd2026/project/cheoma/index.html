    <h2 class="case-copy" style="left:10.52083%;top:2.77778%;width:5%;height:1.52777778%">
      <svg class="case-text" role="presentation" viewBox="0 0 96 33" preserveAspectRatio="none" style="font-size:27.99994px;font-weight:400;fill:#444444;letter-spacing:-0.56006px">
        <text x="0" y="26.45312" textLength="95.1168" lengthAdjust="spacingAndGlyphs">상황분석</text>
      </svg>
    </h2>
    <p class="case-copy" style="left:26.97917%;top:8.84259%;width:45.9375%;height:4.02777778%">
      <svg class="case-text" role="presentation" viewBox="0 0 882 87" preserveAspectRatio="none" style="font-size:24px;font-weight:400;fill:#2a2a2a;letter-spacing:-0.48px">
        <text x="65.67322" y="23.03125" textLength="750.65338" lengthAdjust="spacingAndGlyphs">한국의 고궁과 역사 공간을 찾는 외국인 관람객에게 한옥은 매력적인 여행지입니다.</text>
        <text x="116.32877" y="52.03131" textLength="649.34246" lengthAdjust="spacingAndGlyphs">그러나 짧은 방문으로 경험하는 것은 특정 시간과 날씨의 한 장면입니다.</text>
        <text x="39.90278" y="81.03119" textLength="802.19443" lengthAdjust="spacingAndGlyphs">처마의 곡선은 기억에 남아도, 그 구조가 빛과 그늘을 어떻게 바꾸는지는 놓치기 쉽습니다.</text>
      </svg>
    </p>
    <p class="case-copy" style="left:7.70833%;top:43.14815%;width:28.95833%;height:1.75926222%">
      <svg class="case-text" role="presentation" viewBox="0 0 555.99994 38.00006" preserveAspectRatio="none" style="font-size:32.00006px;font-weight:600;fill:#2a2a2a;letter-spacing:-0.63994px">
        <text x="0" y="30.375" textLength="555.67123" lengthAdjust="spacingAndGlyphs">전통 건축을 보는 것과 이해하는 것은 다릅니다</text>
      </svg>
    </p>
    <p class="case-copy" style="left:7.70833%;top:46.2037%;width:45.20833%;height:2.22222222%">
      <svg class="case-text" role="presentation" viewBox="0 0 867.99994 48" preserveAspectRatio="none" style="font-size:20.00006px;font-weight:400;fill:#2a2a2a;letter-spacing:-0.39994px">
        <text x="0" y="19.10938" textLength="485.72659" lengthAdjust="spacingAndGlyphs">전통 건축에 대한 관심이 처마의 기능에 대한 이해로 이어지려면, </text>
        <text x="0" y="43.10938" textLength="447.45389" lengthAdjust="spacingAndGlyphs">변화하는 빛을 직접 보고 비교할 수 있는경험이 필요합니다.</text>
      </svg>
    </p>
    <p class="case-copy" style="left:36.35417%;top:86.75926%;width:27.1875%;height:1.75926222%">
      <svg class="case-text" role="presentation" viewBox="0 0 522 38.00006" preserveAspectRatio="none" style="font-size:32.00006px;font-weight:600;fill:#2a2a2a;letter-spacing:-0.63994px">
        <text x="0.14938" y="30.375" textLength="521.70125" lengthAdjust="spacingAndGlyphs">짧은 방문으로는 확인하기 어려운 빛의 변화</text>
      </svg>
    </p>
    <p class="case-copy" style="left:26.97917%;top:89.81481%;width:45.9375%;height:2.68518222%">
      <svg class="case-text" role="presentation" viewBox="0 0 882 57.99994" preserveAspectRatio="none" style="font-size:24px;font-weight:400;fill:#2a2a2a;letter-spacing:-0.48px">
        <text x="126.57696" y="23.03125" textLength="628.84589" lengthAdjust="spacingAndGlyphs">많은 외국인 관광객이 한국의 전통 공간을 방문하지만. 짧은 일정 안에 </text>
        <text x="142.37434" y="52.03131" textLength="603.27475" lengthAdjust="spacingAndGlyphs">시간에 따라 달라지는처마 아래의 빛을 모두 경험하기 어렵습니다. </text>
      </svg>
    </p>

      <svg class="case-text" role="presentation" viewBox="0 0 699 87.99994" preserveAspectRatio="none" style="font-size:32.00006px;font-weight:600;fill:#000000;letter-spacing:-0.63994px">
        <text x="0.08429" y="33.375" textLength="698.83123" lengthAdjust="spacingAndGlyphs">같은 빛 아래에서도 처마마다 그림자의 경계는 달라집니다.</text>
        <text x="84.60998" y="77.37506" textLength="529.78003" lengthAdjust="spacingAndGlyphs">그 차이가 처마의 구조와 역할을 드러냅니다.</text>

    <p class="case-copy" style="left:24.89583%;top:50.4012%;width:50.10417%;height:2.90872297%">

        <text x="43.97779" y="23.03125" textLength="874.04429" lengthAdjust="spacingAndGlyphs">처마의 길이와 각도, 겹쳐진 구조는 빛이 들어오는 깊이와 그림자가 머무는 범위에 영향을 줍니다. </text>
        <text x="33.83501" y="52.03131" textLength="894.33005" lengthAdjust="spacingAndGlyphs">그림자를 같은 빛 아래에서 비교하면, 처마가 공간을 조절하는 방식을 더 분명하게 읽을 수 있습니다.</text>
      </svg>

        <text x="0.1031" y="68.37506" textLength="468.79373" lengthAdjust="spacingAndGlyphs">처마가 만드는 환경을 발견하게 합니다.</text>

        <text x="50.84621" y="32.375" textLength="944.30746" lengthAdjust="spacingAndGlyphs">주요 타겟은 한옥과 역사 공간에 관심이 있는 20~30대 외국인 자유여행객으로</text>
        <text x="190.56941" y="74.375" textLength="664.86125" lengthAdjust="spacingAndGlyphs">시각적 경험과 자유로운 탐색을 선호하는 관람객입니다.</text>

    <p class="case-copy" style="left:37.23958%;top:41.85111%;width:25.41667%;height:2.54862938%">

        <text x="0.1344" y="30.375" textLength="487.73126" lengthAdjust="spacingAndGlyphs">자신의 관심에 따라 탐색하는 자유여행객</text>

    <p class="case-copy" style="left:26.97917%;top:46.94836%;width:45.9375%;height:3.89000241%">

        <text x="121.94246" y="23.03125" textLength="638.11507" lengthAdjust="spacingAndGlyphs">외국인 여행객들은 자신의 관심에 따라 여행지를 탐색하고 방문하지만, </text>
        <text x="50.10413" y="52.03131" textLength="781.79155" lengthAdjust="spacingAndGlyphs">짧은 체류 시간과 낯선 건축 용어로 인해 전통 건축의 의미를 깊이 이해하기 어렵습니다.</text>

        <text x="79.32941" y="23.03125" textLength="903.34118" lengthAdjust="spacingAndGlyphs">인터랙션과 웹 아키이빙을 통해 관람객이 빛의 깊이와 그림자의 경계를 스스로 발견하도록 돕습니다. </text>
        <text x="142.77043" y="52.03131" textLength="776.45914" lengthAdjust="spacingAndGlyphs">이를 통해 한옥을 아름다운 외형에서 생활환경을 만드는 구조로 다시 바라보게 합니다.</text>
