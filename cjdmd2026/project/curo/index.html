        <text x="0" y="91.10938" textLength="574.83053" lengthAdjust="spacingAndGlyphs">하는 부모에게, 두려움에서 익숙함으로 나아가는 첫 한 달의 경험을 제공한다.</text>

        <text x="240.28147" y="23.03125" textLength="679.43712" lengthAdjust="spacingAndGlyphs">1형 당뇨 아동에게 인슐린 주사는 건강한 일상을 위해 꼭 필요한 과정입니다.</text>
        <text x="128.24736" y="52.03131" textLength="903.50534" lengthAdjust="spacingAndGlyphs">아이는 매일 주사를 맞으며 생활하고, 성장하면서 조금씩 스스로 건강을 관리하는 방법을 배워갑니다.</text>
        <text x="258.20602" y="81.03119" textLength="643.58822" lengthAdjust="spacingAndGlyphs">그러다 보면 보호자의 도움 없이 혼자 주사해야 하는 순간도 찾아옵니다.</text>
      </svg>
    </p>
    <p class="case-copy" style="left:7.70833%;top:27.17836%;width:34.63542%;height:1.19534646%">

        <text x="0" y="30.375" textLength="664.86125" lengthAdjust="spacingAndGlyphs">하지만 어린아이에게 주사는 낯설고 두려운 경험입니다.</text>
      </svg>
    </p>
    <p class="case-copy" style="left:7.70833%;top:29.25448%;width:45.20833%;height:1.50990878%">
      <svg class="case-text" role="presentation" viewBox="0 0 867.99994 48" preserveAspectRatio="none" style="font-size:20.00006px;font-weight:400;fill:#2a2a2a;letter-spacing:-0.39994px">
        <text x="0" y="19.10938" textLength="668.37811" lengthAdjust="spacingAndGlyphs">익숙하지 않은 주사 도구와 통증에 대한 걱정은 아이에게 큰 부담으로 다가올 수 있습니다.</text>
        <text x="0" y="43.10938" textLength="646.87334" lengthAdjust="spacingAndGlyphs">특히 첫 주사에서의 부정적인 경험은 이후 주사에 대한 거부감으로 이어질 수 있습니다.</text>

        <text x="206.87885" y="21.10938" textLength="453.24211" lengthAdjust="spacingAndGlyphs">“처음에는 인형한테 주사 놓는 법을 알려주고 그다음부터는</text>
        <text x="212.14253" y="49.10931" textLength="442.71475" lengthAdjust="spacingAndGlyphs"><tspan style="font-size:20.00006px;font-weight:500;fill:#1eb2a6;letter-spacing:0px">내 배에 바늘 직접 찌르면서</tspan> 딸에게 한 번해보라고 했다.”</text>
      </svg>
    </p>
    <p class="case-copy" style="left:28.59375%;top:90.94055%;width:42.76042%;height:1.19534646%">
      <svg class="case-text" role="presentation" viewBox="0 0 821.00006 38.00006" preserveAspectRatio="none" style="font-size:32.00006px;font-weight:600;fill:#000000;letter-spacing:-0.63994px">
        <text x="0.09811" y="30.375" textLength="820.80384" lengthAdjust="spacingAndGlyphs">가정에서는 적절한 연습 도구 없이 주사 교육이 이루어지고 있습니다.</text>
      </svg>
    </p>
    <p class="case-copy" style="left:23.95833%;top:92.60774%;width:51.97917%;height:1.82447109%">
      <svg class="case-text" role="presentation" viewBox="0 0 998.00006 57.99994" preserveAspectRatio="none" style="font-size:24px;font-weight:400;fill:#2a2a2a;letter-spacing:-0.48px">
        <text x="34.37971" y="23.03125" textLength="929.24064" lengthAdjust="spacingAndGlyphs">아이들은 보호자의 도움으로 주사 방법을 배우지만, 적절한 실습 도구가 없어 쿠션이나 인형 등을 활용해</text>
        <text x="47.29421" y="52.03131" textLength="903.41165" lengthAdjust="spacingAndGlyphs">연습하고 있습니다. 이러한 상황은 아이의 학습뿐 아니라 보호자에게도 부담으로 이어질 수 있습니다.</text>
      </svg>
    </p>

        <text x="30.51629" y="32.375" textLength="1084.96762" lengthAdjust="spacingAndGlyphs">현재 가정에서 이루어지는 주사 교육은 적절한 실습 도구와 체계적인 학습 과정이 부족하여,</text>
        <text x="162.59808" y="74.375" textLength="820.80384" lengthAdjust="spacingAndGlyphs">아이가 올바른 주사 방법을 단계적으로 익히는 데 어려움이 있습니다.</text>

    <h2 class="case-copy" style="left:10.46875%;top:3.23799%;width:5%;height:1.78089584%">

        <text x="0" y="26.45312" textLength="95.1168" lengthAdjust="spacingAndGlyphs">인사이트</text>

    <p class="case-copy" style="left:27.39583%;top:11.11711%;width:45.15625%;height:4.74905213%">
      <svg class="case-text" role="presentation" viewBox="0 0 867 87.99994" preserveAspectRatio="none" style="font-size:32.00006px;font-weight:600;fill:#000000;letter-spacing:-0.63994px">
        <text x="0.12115" y="33.375" textLength="866.7575" lengthAdjust="spacingAndGlyphs">아동이 올바른 주사 방법을 익히고 스스로 자가주사를 수행하기 위해서는</text>
        <text x="84.08429" y="77.37506" textLength="698.83123" lengthAdjust="spacingAndGlyphs">정확한 피드백을 바탕으로 한 체계적인 교육이 필요합니다.</text>
      </svg>
    </p>
    <p class="case-copy" style="left:25.72917%;top:54.23637%;width:48.4375%;height:3.13005591%">
      <svg class="case-text" role="presentation" viewBox="0 0 930 57.99994" preserveAspectRatio="none" style="font-size:24px;font-weight:400;fill:#2a2a2a;letter-spacing:-0.48px">
        <text x="38.10893" y="23.03125" textLength="853.78214" lengthAdjust="spacingAndGlyphs">주사 교육은 단순히 방법을 알려주는 것에서 끝나지 않습니다. 주사 부위와 각도, 인슐린 주입 후</text>
        <text x="30.73786" y="52.03131" textLength="868.52429" lengthAdjust="spacingAndGlyphs">유지 시간 등 중요한 요소를 반복해서 연습하고, 자신의 수행 과정을 확인하는 경험이 중요합니다.</text>
      </svg>
    </p>
    <p class="case-copy" style="left:29.47917%;top:83.27037%;width:40.98958%;height:4.10145364%">
      <svg class="case-text" role="presentation" viewBox="0 0 786.99994 75.99994" preserveAspectRatio="none" style="font-size:32.00006px;font-weight:600;fill:#1eb2a6;letter-spacing:-0.63994px">
        <text x="0.00499" y="30.375" textLength="786.98995" lengthAdjust="spacingAndGlyphs">주사에 친숙해지는 과정부터 실제로 스스로 주사를 놓는 순간까지,</text>
        <text x="64.14682" y="68.37506" textLength="658.7063" lengthAdjust="spacingAndGlyphs">아이가 배운 내용을 자신 있게 실천할 수 있어야 합니다.</text>
      </svg>
    </p>
  </section>

        <text x="209.90573" y="32.375" textLength="580.18867" lengthAdjust="spacingAndGlyphs">첫 자가주사를 준비하는 6~7세 1형 당뇨 아동과,</text>
        <text x="150.58445" y="74.375" textLength="698.83123" lengthAdjust="spacingAndGlyphs">아이의 교육을 돕는 보호자를 주요 대상으로 설정했습니다.</text>
      </svg>
    </p>
    <p class="case-copy" style="left:35.20833%;top:41.89008%;width:29.53125%;height:2.54692118%">

        <text x="0.04685" y="30.375" textLength="566.9063" lengthAdjust="spacingAndGlyphs">왜 6~7세 아동의 첫 자가주사에 주목했을까요?</text>

    </p>
    <p class="case-copy" style="left:26.77083%;top:46.98391%;width:46.35417%;height:5.8310992%">

        <text x="11.19437" y="23.03125" textLength="873.63475" lengthAdjust="spacingAndGlyphs">아이들이 자가주사를 배우기 시작하는 6~11세 중, 특히 6~8세 아동에게서 주사에 대한 두려움이 </text>
        <text x="42.44352" y="52.03131" textLength="805.11283" lengthAdjust="spacingAndGlyphs">가장 크게 나타납니다. CURO는 이러한 초기 자가주사 적응 시기에 주목해, 첫 자가주사를</text>
        <text x="204.95827" y="81.03119" textLength="480.08352" lengthAdjust="spacingAndGlyphs">준비하는 6~7세 아동을 핵심 타깃으로 선정했습니다.</text>
