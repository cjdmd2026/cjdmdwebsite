<!doctype html>
<html lang="ko" data-base="app/">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#37BBB0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>CURO — 내 손안의 1형 당뇨 전문 케어 앱</title>
  <link rel="icon" href="app/img/symbol.webp">
  <link rel="preload" href="app/fonts/freesentation-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="app/fonts/freesentation-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app/css/app.css?v=7">
</head>
<body>
  <!-- 화면은 js/app.js 가 #app 안에 하나씩 그림 (주소 #/home, #/edu …) -->
  <div class="frame" id="frame">
  <main class="app" id="app"></main>

  <div class="dock" id="dock">
    <div id="fab-slot"></div>
    <button class="topbtn" id="topbtn" aria-label="맨 위로"><img src="app/img/i-top.webp" alt="">TOP</button>
    <nav class="tabbar" id="tabbar" aria-label="하단 메뉴">
      <button data-tab="home"><img src="app/img/tab-home.webp" alt="">홈</button>
      <button data-tab="edu"><img src="app/img/tab-edu.webp" alt="">교육</button>
      <button data-tab="com"><img src="app/img/tab-com.webp" alt="">커뮤니티</button>
      <button data-tab="my"><img src="app/img/tab-my.webp" alt="">마이</button>
    </nav>
  </div>

  <div class="dim" id="dim">
    <div class="pick" role="dialog" aria-label="날짜 선택">
      <h4><button data-mv="-1" aria-label="이전 달">‹</button><span></span><button data-mv="1" aria-label="다음 달">›</button></h4>
      <div class="cal7"></div>
      <div class="row"><button class="btn is-off" style="pointer-events:auto" data-cancel>뒤로가기</button><button class="btn" data-ok>완료</button></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  </div>

  <script src="app/js/app.js?v=7"></script>
</body>
</html>
