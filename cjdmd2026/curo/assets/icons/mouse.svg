<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- 162차: 임시 마우스 아이콘 (export 된 파일이 생기면 교체). 색 = arrow-down.svg 와 같은 #61523F -->
  <rect x="10" y="3" width="16" height="27" rx="8" stroke="#61523F" stroke-width="2.2"/>
  <rect x="16.9" y="8" width="2.2" height="5.5" rx="1.1" fill="#61523F">
    <animate attributeName="y" values="8;12.5;8" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
  </rect>
</svg>
