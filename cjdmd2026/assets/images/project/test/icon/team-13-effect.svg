<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="team-13-effect" viewBox="-14 -14 268 268" role="img" aria-labelledby="team-13-effect-title">
  <title id="team-13-effect-title">Effect animated icon</title>
  <style>
    #team-13-effect .icon-layer {
      transform-box: view-box;
      transform-origin: 120px 120px;
      animation: team-13-effect-enter 700ms cubic-bezier(.22, 1, .36, 1) both;
    }
    #team-13-effect .layer-1 { animation-delay: 120ms; }
    #team-13-effect .layer-2 { animation-delay: 500ms; }
    @keyframes team-13-effect-enter {
      0% { transform: scale(0); animation-timing-function: ease-in-out; }
      50% { transform: scale(1.11); animation-timing-function: ease-in-out; }
      70% { transform: scale(.96); animation-timing-function: ease-out; }
      100% { transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      #team-13-effect .icon-layer { animation: none; }
    }
  </style>
  <g id="team-13-effect-background"><rect width="240" height="240" fill="#15131a"></rect></g>
