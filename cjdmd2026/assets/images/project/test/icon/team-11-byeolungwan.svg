<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="team-11-byeolungwan" viewBox="-14 -14 268 268" role="img" aria-labelledby="team-11-byeolungwan-title">
  <title id="team-11-byeolungwan-title">Byeolungwan animated icon</title>
  <style>
    #team-11-byeolungwan .icon-layer {
      transform-box: view-box;
      transform-origin: 120px 120px;
      animation: team-11-byeolungwan-enter 700ms cubic-bezier(.22, 1, .36, 1) both;
    }
    #team-11-byeolungwan .layer-1 { animation-delay: 120ms; }
    #team-11-byeolungwan .layer-2 { animation-delay: 500ms; }
    @keyframes team-11-byeolungwan-enter {
      0% { transform: scale(0); animation-timing-function: ease-in-out; }
      50% { transform: scale(1.11); animation-timing-function: ease-in-out; }
      70% { transform: scale(.96); animation-timing-function: ease-out; }
      100% { transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      #team-11-byeolungwan .icon-layer { animation: none; }
    }
  </style>
