  <title id="team-10-ieoon-title">Ieoon animated icon</title>
  <style>
    #team-10-ieoon .icon-layer {
      transform-box: view-box;
      transform-origin: 120px 120px;
      animation: team-10-ieoon-enter 700ms cubic-bezier(.22, 1, .36, 1) both;
    }
    #team-10-ieoon .layer-1 { animation-delay: 120ms; }
    #team-10-ieoon .layer-2 { animation-delay: 500ms; }
    @keyframes team-10-ieoon-enter {
      0% { transform: scale(0); animation-timing-function: ease-in-out; }
      50% { transform: scale(1.11); animation-timing-function: ease-in-out; }
      70% { transform: scale(.96); animation-timing-function: ease-out; }
      100% { transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      #team-10-ieoon .icon-layer { animation: none; }
    }
  </style>
