<svg xmlns="http://www.w3.org/2000/svg" id="team-05-kuro" viewBox="-14 -14 268 268" role="img" aria-labelledby="team-05-kuro-title">
  <title id="team-05-kuro-title">Kuro animated icon</title>
  <style>
    #team-05-kuro .icon-layer {
      transform-box: view-box;
      transform-origin: 120px 120px;
      animation: team-05-kuro-enter 700ms cubic-bezier(.22, 1, .36, 1) both;
    }
    #team-05-kuro .layer-1 { animation-delay: 120ms; }
    #team-05-kuro .layer-2 { animation-delay: 500ms; }
    #team-05-kuro .layer-3 { animation-delay: 880ms; }
    @keyframes team-05-kuro-enter {
      0% { transform: scale(0); animation-timing-function: ease-in-out; }
      50% { transform: scale(1.11); animation-timing-function: ease-in-out; }
      70% { transform: scale(.96); animation-timing-function: ease-out; }
      100% { transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      #team-05-kuro .icon-layer { animation: none; }
    }
  </style>
