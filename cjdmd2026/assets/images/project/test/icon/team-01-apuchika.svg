<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="team-01-apuchika" viewBox="-14 -14 268 268" role="img" aria-labelledby="team-01-apuchika-title">
  <title id="team-01-apuchika-title">Apuchika animated icon</title>
  <style>
    #team-01-apuchika .icon-layer {
      transform-box: view-box;
      transform-origin: 120px 120px;
      animation: team-01-apuchika-enter 700ms cubic-bezier(.22, 1, .36, 1) both;
    }
    #team-01-apuchika .layer-1 { animation-delay: 120ms; }
    #team-01-apuchika .layer-2 { animation-delay: 500ms; }
    #team-01-apuchika .layer-3 { animation-delay: 880ms; }
    @keyframes team-01-apuchika-enter {
      0% { transform: scale(0); animation-timing-function: ease-in-out; }
      50% { transform: scale(1.11); animation-timing-function: ease-in-out; }
      70% { transform: scale(.96); animation-timing-function: ease-out; }
      100% { transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      #team-01-apuchika .icon-layer { animation: none; }
    }
  </style>
  <g id="team-01-apuchika-background"><rect width="240" height="240" fill="#15131a"></rect></g>
