  <title id="team-02-ommix-title">Ommix animated icon</title>
  <style>
    #team-02-ommix .icon-layer {
      transform-box: view-box;
      transform-origin: 120px 120px;
      animation: team-02-ommix-enter 700ms cubic-bezier(.22, 1, .36, 1) both;
    }
    #team-02-ommix .layer-1 { animation-delay: 120ms; }
    #team-02-ommix .layer-2 { animation-delay: 500ms; }
    #team-02-ommix .layer-3 { animation-delay: 880ms; }
    @keyframes team-02-ommix-enter {
      0% { transform: scale(0); animation-timing-function: ease-in-out; }
      50% { transform: scale(1.11); animation-timing-function: ease-in-out; }
      70% { transform: scale(.96); animation-timing-function: ease-out; }
      100% { transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      #team-02-ommix .icon-layer { animation: none; }
    }
  </style>
