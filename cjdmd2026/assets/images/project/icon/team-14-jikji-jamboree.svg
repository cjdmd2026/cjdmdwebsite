  <title id="team-14-jikji-jamboree-title">Jikji Jamboree animated icon</title>
  <style>
    #team-14-jikji-jamboree .icon-layer {
      transform-box: view-box;
      transform-origin: 120px 120px;
      animation: team-14-jikji-jamboree-enter 700ms cubic-bezier(.22, 1, .36, 1) both;
    }
    #team-14-jikji-jamboree .layer-1 { animation-delay: 120ms; }
    @keyframes team-14-jikji-jamboree-enter {
      0% { transform: scale(0); animation-timing-function: ease-in-out; }
      50% { transform: scale(1.11); animation-timing-function: ease-in-out; }
      70% { transform: scale(.96); animation-timing-function: ease-out; }
      100% { transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      #team-14-jikji-jamboree .icon-layer { animation: none; }
    }
  </style>
