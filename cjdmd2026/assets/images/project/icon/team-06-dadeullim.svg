  <title id="team-06-dadeullim-title">Dadeullim animated icon</title>
  <style>
    #team-06-dadeullim .icon-layer {
      transform-box: view-box;
      transform-origin: 120px 120px;
      animation: team-06-dadeullim-enter 700ms cubic-bezier(.22, 1, .36, 1) both;
    }
    #team-06-dadeullim .layer-1 { animation-delay: 120ms; }
    #team-06-dadeullim .layer-2 { animation-delay: 500ms; }
    #team-06-dadeullim .layer-3 { animation-delay: 880ms; }
    @keyframes team-06-dadeullim-enter {
      0% { transform: scale(0); animation-timing-function: ease-in-out; }
      50% { transform: scale(1.11); animation-timing-function: ease-in-out; }
      70% { transform: scale(.96); animation-timing-function: ease-out; }
      100% { transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      #team-06-dadeullim .icon-layer { animation: none; }
    }
  </style>
