<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .slide-card {
      transform-box: fill-box;
      transform-origin: center;
      animation: card-swap 2.4s cubic-bezier(0.45, 0, 0.2, 1) infinite;
    }

    .slide-line-one {
      transform-box: fill-box;
      transform-origin: center;
      animation: line-swap 2.4s cubic-bezier(0.45, 0, 0.2, 1) infinite;
    }

    @keyframes card-swap {
      0%, 18%, 100% { transform: translateX(0); }
      44%, 60% { transform: translateX(4px); }
      86% { transform: translateX(0); }
    }

    @keyframes line-swap {
      0%, 18%, 100% { transform: translateX(0); }
      44%, 60% { transform: translateX(-10px); }
      86% { transform: translateX(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .slide-card,
      .slide-line-one {
        animation: none;
      }
    }
  </style>

  <rect class="slide-card" x="13.9844" y="12.875" width="6.25" height="13.25" rx="1.75" stroke="white" stroke-width="1.75"/>
  <line class="slide-line-one" x1="24.1094" y1="13" x2="24.1094" y2="26" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line class="slide-line-two" x1="28.1094" y1="13" x2="28.1094" y2="26" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
