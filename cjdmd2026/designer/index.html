<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유연한 결합: 청주대학교 디지털미디어디자인</title>
    <link rel="stylesheet" href="../css/designer_02.css">
    <link rel="stylesheet" href="../css/mobile-common.css">
    <script>
        if (sessionStorage.getItem('stamp-page-transition') === '1') {
            document.documentElement.classList.add('page-transition-preload');
        }
    </script>    

    <!-- Scripts:S -->
    <script src="../js/stamp-effect-transition.js" defer></script>
    <script src="../js/typewriter-effect.js" defer></script>
    <script src="../js/designer-data.js" defer></script>
    <script src="../js/designer-icon-data.js" defer></script>
    <script src="../js/designer_02.js" defer></script>
    <script src="../js/designer-filter.js" defer></script>

    <script src="../js/designer-icon-slide.js" defer></script>

    <script src="../js/page-transition.js" defer></script>
    <!--<script src="../js/thread-crosshair-mask.js" defer></script> -->
    <script src="../js/student-mouse-effect.js" defer></script>

    <script>
    const lenis = new Lenis({
        duration: 1.0,  
        smoothWheel: true,
        wheelMultiplier: 1.25
    });

    function raf(time) {
        lenis.raf(time);
        requestAnimationFrame(raf);
    }

    requestAnimationFrame(raf);
    </script>

    <!-- 아이콘 슬라이드는 브라우저 기본 세로 스크롤을 사용합니다. -->
    <!-- Scripts:E -->
</head>
<body>
    <!-- Header:S -->
    <header class="header">
        <div class="container">
            <!-- 로고 -->
            <h1 class="logo"><a href="../index.html" page-transition>유연한 결합</a></h1>

            <!-- 네비게이션 -->
            <nav class="nav" aria-label="주요 메뉴">
                <ul>
                    <li><a href="../project/" page-transition>프로젝트</a></li>
                    <li><a href="../designer/" page-transition aria-current="page">디자이너</a></li>
                    <li><a href="../archive/" page-transition>아카이브</a></li>
                </ul>
            </nav>

            <!-- 모바일 메뉴 버튼 -->
            <button class="menu-button" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="designer-mobile-menu">
                <span></span><span></span><span></span>
            </button>
        </div>
        <nav id="designer-mobile-menu" class="mobile-menu" aria-label="모바일 메뉴" hidden>
            <ul>
                <li><a href="../project/index_03.html" page-transition>프로젝트</a></li>
                <li><a href="../designer/index_02.html" page-transition aria-current="page">디자이너</a></li>
                <li><a href="../archive/index_02.html" page-transition>아카이브</a></li>
            </ul>
            <p>청주대학교 디지털미디어디자인학과 · 2026</p>
        </nav>
    </header>
    <!-- Header:E -->

    <!-- Main:S -->
    <main class="main designer-page slide-view icon-slide-page" id="scrollScene">
        <div class="container">
            <!-- Designer 제목 및 검색 영역 -->
            <section class="title-section designer-heading" aria-labelledby="designer-title-slide">
                <div class="left-side designer-heading__top mobile-title-row">
                    <div class="textbox">
                        <h2 id="designer-title-slide" class="designer-heading__title designer-heading__title--slide">34명의 결합</h2>
                        <h2 id="designer-title-grid" class="designer-heading__title designer-heading__title--grid mobile-page-title">디자이너</h2>
                    </div>
                    <div class="mobile-view-toggle" role="group" aria-label="디자이너 보기 방식">
                        <button id="designer-mobile-grid-toggle" class="mobile-view-toggle__button" type="button" data-mobile-view="grid" aria-label="Grid View" aria-pressed="false">
                            <img src="../assets/images/icons/grid-scroll-icon.svg" alt="">
                        </button>
                        <button id="designer-mobile-slide-toggle" class="mobile-view-toggle__button" type="button" data-mobile-view="slide" aria-label="Slide View" aria-pressed="true">
                            <img src="../assets/images/icons/side-scroll-icon.svg" alt="">
                        </button>
                    </div>
                    
                    <div class="view-buttons">
                        <button class="view-button" type="button" data-view="grid" aria-label="그리드 보기로 전환">
                            <img src="../assets/images/icons/grid-scroll-icon.svg" class="icon" alt="">
                            <span>그리드 보기</span>
                        </button>
                    </div>
                </div>

                <div class="search-bar">
                    <img src="../assets/images/icons/search-icon.svg" class="icon" alt="">
                    <input type="text" placeholder="디자이너를 검색해 주세요" aria-label="디자이너 검색">
                </div>
            </section>

            <!-- Slide View: 결합 → 스크롤 정렬 → 색상 분리 및 학생 정보 -->
            <!-- 학생 정보는 designer-data.js의 window.DESIGNERS를 사용합니다. -->
            <section class="formation-slide" aria-label="아이콘으로 보는 디자이너">
                <div class="stage" id="stage">
                  <h1 class="fallback" id="formation-title">결합</h1>
                  <h2 class="spread-heading" id="spreadHeading" aria-hidden="true">14개의 결합</h2>
                  <ul class="icon-list" id="iconList" aria-label="결합을 이루는 14개의 프로젝트 아이콘" hidden></ul>
                  <canvas id="formation" aria-hidden="true"></canvas>
                  <aside class="formation-panel" id="designerPanel" aria-labelledby="designerPanelTitle" aria-hidden="true" inert hidden>
                    <div class="formation-panel-header">
                      <h3 class="formation-panel-title" id="designerPanelTitle"></h3>
                      <button class="formation-close" id="designerClose" type="button" aria-label="디자이너 정보 닫기">×</button>
                    </div>
                    <div class="formation-rows" id="designerRows"></div>
                  </aside>
                </div>
                <div class="interaction">
                  <p class="hint" id="hint" role="status">아이콘이 모이고 있습니다.</p>
                  <div class="controls">
                    <button class="control" id="spreadToggle" type="button" aria-pressed="false" disabled>아이콘 펼치기 ↓</button>
                    <button class="control" id="replay" type="button" disabled>
                      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M3 6a5.2 5.2 0 1 1-.2 4M3 2v4h4"/></svg>
                      다시 모으기
                    </button>
                    <button class="control" id="pause" type="button" aria-pressed="false" disabled>움직임 멈추기</button>
                  </div>
                </div>
                <p class="formation-empty" id="formationEmpty" role="status" hidden>검색 결과가 없습니다.</p>
            </section>

            <div class="formation-scroll-cue" id="formationScrollCue" hidden>
                <img class="icon" src="../assets/images/icons/mouse-icon.svg" width="64" height="64" alt="" aria-hidden="true">
                <span class="formation-scroll-cue__label">Scroll Down</span>
            </div>

        <!-- Designer Stage. -->
        <div class="designer-stage">
            <!-- 좌측 Side 영역
            장식선을 div로 교체 원하시면 연락주세요 -->
            <aside class="designer-side">
                <!--<span class="designer-side__line" aria-hidden="true"></span>-->

                <nav class="designer-filter" aria-label="디자이너 초성 필터">
                    <span class="designer-filter__indicator" aria-hidden="true">
                        <span class="designer-filter__indicator-shape"></span>
                    </span>
                    <button class="designer-filter__button is-active" type="button" data-initial="all" aria-pressed="true"><span class="label-slide">All</span><span class="label-grid">전체</span></button>
                    <button class="designer-filter__button" type="button" data-initial="ㄱ" aria-pressed="false">ㄱ</button>
                    <button class="designer-filter__button" type="button" data-initial="ㄴ" aria-pressed="false">ㄴ</button>
                    <button class="designer-filter__button" type="button" data-initial="ㄷ" aria-pressed="false">ㄷ</button>
                    <button class="designer-filter__button" type="button" data-initial="ㄹ" aria-pressed="false">ㄹ</button>
                    <button class="designer-filter__button" type="button" data-initial="ㅁ" aria-pressed="false">ㅁ</button>
                    <button class="designer-filter__button" type="button" data-initial="ㅂ" aria-pressed="false">ㅂ</button>
                    <button class="designer-filter__button" type="button" data-initial="ㅅ" aria-pressed="false">ㅅ</button>
                    <button class="designer-filter__button" type="button" data-initial="ㅇ" aria-pressed="false">ㅇ</button>
                    <button class="designer-filter__button" type="button" data-initial="ㅈ" aria-pressed="false">ㅈ</button>
                    <button class="designer-filter__button" type="button" data-initial="ㅊ" aria-pressed="false">ㅊ</button>
                    <button class="designer-filter__button" type="button" data-initial="ㅋ" aria-pressed="false">ㅋ</button>
                    <button class="designer-filter__button" type="button" data-initial="ㅌ" aria-pressed="false">ㅌ</button>
                    <button class="designer-filter__button" type="button" data-initial="ㅍ" aria-pressed="false">ㅍ</button>
                    <button class="designer-filter__button" type="button" data-initial="ㅎ" aria-pressed="false">ㅎ</button>
                </nav>
            </aside>
        </div>
        </div>

        <!-- Designer Slider -->
        <section class="designer-slider" aria-label="디자이너 목록">
                <div class="card-container">
                    <div class="designer-track">
                        <!-- designer-data.js + designer_02.js에서 카드 자동 생성 -->
                    </div>
                </div>
            </section>
    </main>
    <p class="designer-grid-empty" role="status" hidden>검색 결과가 없습니다.</p>
    <!-- Main:E -->

    <!-- Footer:S -->
    <footer class="footer">
        <div class="container">
            <div class="footer-info">
                <h3>청주대학교 <br> 디지털미디어디자인학과</h3>
                <p>&copy; 2026 Digital Media Design. All rights reserved.</p>
            </div>
            <div class="footer-icons">
                <a href="#"><img class="icon" src="../assets/images/icons/dmd-icon.svg" alt="Digital Media Design"></a>
                <a href="#"><img class="icon" src="../assets/images/icons/instagram-icon.svg" alt="Instagram"></a>
            </div>
        </div>
    </footer>
    <!-- Footer:E -->
    <!-- 모바일 기본 보기 및 보기 전환을 수정한 designer-mobile-02.js와 함께 적용합니다. -->
    <script src="../js/designer-mobile-02.js" defer></script>
</body>
</html>
