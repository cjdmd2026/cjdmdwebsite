<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="team-04-ilkko" viewBox="-14 -14 268 268" role="img" aria-labelledby="team-04-ilkko-title">
  <title id="team-04-ilkko-title">Ilkko animated icon</title>
  <style>
    #team-04-ilkko .icon-layer {
      transform-box: view-box;
      transform-origin: 120px 120px;
      animation: team-04-ilkko-enter 700ms cubic-bezier(.22, 1, .36, 1) both;
    }
    #team-04-ilkko .layer-1 { animation-delay: 120ms; }
    #team-04-ilkko .layer-2 { animation-delay: 500ms; }
    #team-04-ilkko .layer-3 { animation-delay: 880ms; }
    @keyframes team-04-ilkko-enter {
      0% { transform: scale(0); animation-timing-function: ease-in-out; }
      50% { transform: scale(1.11); animation-timing-function: ease-in-out; }
      70% { transform: scale(.96); animation-timing-function: ease-out; }
      100% { transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      #team-04-ilkko .icon-layer { animation: none; }
    }
  </style>
