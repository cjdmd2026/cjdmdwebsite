  <title id="team-09-magmoa-title">Magmoa animated icon</title>
  <style>
    #team-09-magmoa .icon-layer {
      transform-box: view-box;
      transform-origin: 120px 120px;
      animation: team-09-magmoa-enter 700ms cubic-bezier(.22, 1, .36, 1) both;
    }
    #team-09-magmoa .layer-1 { animation-delay: 120ms; }
    #team-09-magmoa .layer-2 { animation-delay: 500ms; }
    @keyframes team-09-magmoa-enter {
      0% { transform: scale(0); animation-timing-function: ease-in-out; }
      50% { transform: scale(1.11); animation-timing-function: ease-in-out; }
      70% { transform: scale(.96); animation-timing-function: ease-out; }
      100% { transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      #team-09-magmoa .icon-layer { animation: none; }
    }
  </style>
