<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>2D 아이콘 패턴 → 결합</title>
  <style>
    *{box-sizing:border-box}
    html{background:white;scroll-behavior:auto;overscroll-behavior:none;scrollbar-width:none}
    html::-webkit-scrollbar{display:none}
    body{margin:0;color:#202020;font:14px/1.5 system-ui,sans-serif}
    #track{height:185vh}
    #scene{position:fixed;inset:0;overflow:hidden}
    #scene canvas{display:block;width:100%;height:100%}
    #controls{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));z-index:1}
    #move,#status{font:inherit;background:#fffffff2;color:#222;padding:8px 15px;border:1px solid #dedede;border-radius:24px}
    #move{cursor:pointer}#move:hover,#move:focus-visible{border-color:#666}#move:disabled{cursor:default;color:#555}
    #status{margin:0}#status a{color:inherit}
  </style>
</head>
<body>
  <main id="track" aria-label="2D 아이콘 패턴에서 결합까지">
    <div id="scene" role="img" aria-label="33종의 2D 아이콘이 반복된 패턴에서 세로 글자 ‘결합’으로 이어지는 애니메이션"></div>
  </main>
  <div id="controls">
    <p id="status" role="status">아이콘을 준비하는 중…</p>
    <button type="button" id="move" hidden>결합 보기 ↓</button>
  </div>
  <noscript><a href="art/gyeolhap.svg">결합 SVG 열기</a></noscript>
  <script src="demo.js" defer></script>
</body>
</html>
